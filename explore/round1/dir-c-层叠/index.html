<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>卡路里拍立得 · 层叠方向</title>
<style>
/* ============ 设计令牌：一套材质，阴影只有一个推导公式 ============ */
:root{
  --ink:#1c1916;
  --ink-2:#4a4139;
  --ink-3:#7a6e63;
  --paper:#f3ecdd;
  --paper-hi:#fbf6ec;
  --paper-lo:#e3d6c0;
  --paper-edge:#cbbba0;
  --table:#211d19;
  --table-2:#2b2621;
  --table-3:#171310;
  --accent:#c4512f;
  --seal:#a8322a;
  --brass:#c9a25f;
  --cream:#f6efe1;
  --cream-72:rgba(246,239,225,.72);

  /* 类别色：卡片左侧露出的色条，叠起来成一列菜品配比 */
  --c-staple:#c9974a;
  --c-meat:#b0462f;
  --c-veg:#4e7c5b;
  --c-egg:#c9a24a;
  --c-soup:#3e7c8a;
  --c-other:#8a7a66;

  /* 阴影单一公式：所有卡片都从这里取，不许各写各的 */
  --sh-a:0 calc(1px + var(--dz,0) * 1px) 0 rgba(120,96,64,.30);
  --sh-b:0 calc(6px + var(--dz,0) * 3px) calc(16px + var(--dz,0) * 9px) rgba(10,8,6,.42);
  --sh-c:0 calc(14px + var(--dz,0) * 6px) calc(34px + var(--dz,0) * 14px) rgba(6,4,2,.36);

  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);
  color:var(--cream);
  background:
    radial-gradient(120% 72% at 50% -8%, #33291f 0%, var(--table-2) 34%, var(--table) 66%, var(--table-3) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* 木纹桌面：极淡的重复织理，只做底层，不参与动画 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(91deg, rgba(0,0,0,0) 0 11px, rgba(0,0,0,.10) 11px 12px),
    repeating-linear-gradient(91deg, rgba(255,224,180,0) 0 43px, rgba(255,224,180,.015) 43px 44px);
}
/* 桌面接触光：叠得越重、越靠下越暗，由 JS 写 --press */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(96% 54% at 50% 100%, rgba(0,0,0,var(--press,.34)) 0%, rgba(0,0,0,0) 62%);
}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.is-on{display:flex;flex-direction:column}
.screen.is-on>.wrap{flex:1 0 auto}
.screen.is-on>.dock{margin-top:auto}
.wrap{width:100%;max-width:440px;margin:0 auto;padding:0 18px}
/* 底坞是桌沿不是遮罩：给可滚动内容留出坞高+余量，首屏/叠卡/小票不被压住（must-fix 1） */
#scr-new>.wrap{padding-bottom:calc(96px + var(--safe-b))}
#scr-today>.wrap{padding-bottom:calc(100px + var(--safe-b))}
</style>
<style>
/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
.topbar .brand{display:flex;flex-direction:column;gap:2px}
.topbar .brand b{font-size:15px;letter-spacing:.06em;color:var(--cream);font-weight:600}
.topbar .brand span{font-size:11.5px;letter-spacing:.05em;color:var(--cream-72)}
.topbar .today{text-align:right;font-size:12px;letter-spacing:.04em;color:var(--cream-72)}
.topbar .today strong{display:block;font-family:var(--mono);font-size:19px;letter-spacing:.02em;color:var(--brass);font-weight:500}
.rule{height:1px;background:linear-gradient(90deg,rgba(201,162,95,0),rgba(201,162,95,.45),rgba(201,162,95,0))}

/* ============ 数字：纸面打印机感 ============ */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ============ 卡片堆栈舞台 ============ */
/* 卡厚 ∝ 该道菜千卡：每张被压住的卡露出 band = 30 + 千卡*0.03（钳在 30–46px），
   于是整叠的抬升高度随整餐热量增长——「整餐热量是这叠卡的合力」在几何上成立。
   JS 逐卡写入 --ty（累积抬升量）与 --band。 */
.stage{position:relative;perspective:1100px;perspective-origin:50% 2%;margin:0 -2px;padding-top:calc(var(--rise,0px) + 44px)}
.deck{position:relative;height:var(--card-h,206px)}
.deck-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* cf-justify: 这是一张实体菜卡，矩形是母题本身（可推开/翻起/叠合的卡片），圆角模拟切好的硬纸卡四角；材质靠多层 background 渐变+纸纤维颗粒+胶带+类别色条+三层推导阴影堆出，非默认容器 */
.dish-card{
  position:absolute;left:0;right:0;top:0;height:var(--card-h,206px);
  border-radius:11px; /* cf-justify: 实体菜卡切角，母题本体 */
  transform-origin:50% 0%;
  transform:
    translateX(var(--dx,0px))
    translateY(var(--ty,0px))
    translateZ(calc(var(--i) * -30px))
    rotateX(calc(var(--i) * 1.15deg))
    rotateY(var(--dry,0deg))
    scale(calc(1 - var(--i) * .022));
  z-index:calc(60 - var(--i));
  --dz:calc(var(--i) * 1.3 + .45);
  /* 侧壁厚度：三层硬偏移暗影 + 底缘亮线，让卡像"切出来的纸"而非画上的矩形（借 React Bits Tilted Card 的挤出做法） */
  box-shadow:
    var(--sh-a),
    0 1px 0 rgba(255,250,238,.9),
    0 3px 0 rgba(120,96,64,.62),
    0 5px 0 rgba(176,150,112,.95),
    var(--sh-b),var(--sh-c);
  transition:transform .5s cubic-bezier(.2,1.12,.3,1), opacity .3s ease, box-shadow .5s ease;
  will-change:transform;
  cursor:grab;
  touch-action:pan-y;
  background:
    repeating-linear-gradient(93deg, rgba(150,120,80,.045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(3deg, rgba(110,84,48,.04) 0 1px, transparent 1px 4px),
    radial-gradient(130% 120% at 18% -10%, var(--paper-hi) 0%, var(--paper) 52%, var(--paper-lo) 100%);
  border:1px solid rgba(255,255,255,.55);
  overflow:hidden;
  user-select:none;
}
/* 打孔鸡眼扣：真实孔位（透出桌面）+ 双圈黄铜环，与快门同源；落在顶边不被上卡切断 */
.dish-card .grommet{position:absolute;top:9px;right:12px;width:15px;height:15px;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 50% 40%, #1d1813 0 40%, #3a2f22 52%, #6b5228 68%, #c9a25f 82%, #8a6a34 100%);
  box-shadow:0 1px 0 rgba(255,246,222,.5) inset, 0 0 0 1px rgba(90,60,20,.5), 0 2px 3px rgba(0,0,0,.4)}
.dish-card.is-deep .grommet{display:none}
/* 纸纤维颗粒 + 顶部叠压阴影（前一张卡投在它上面的暗带） */
.dish-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(rgba(90,68,40,.10) .6px, transparent .8px) 0 0/6px 6px,
    linear-gradient(180deg, rgba(30,22,14,.30) 0, rgba(30,22,14,.10) 10px, transparent 26px);
  opacity:calc(.5 + var(--i) * .12);
}
/* 类别色边：左侧一窄条，叠起来成为一列菜品配比 */
.dish-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:7px;z-index:2;
  background:linear-gradient(90deg,var(--cat),color-mix(in srgb,var(--cat) 70%,#000) 100%);
  box-shadow:inset -1px 0 0 rgba(0,0,0,.25);
}
.dish-card.is-front{border-color:rgba(255,255,255,.75);cursor:grab}
.dish-card.is-front .tape{opacity:1}
.dish-card.is-deep .tape{opacity:0}
.dish-card.is-deep .peel{display:none}
.dish-card.is-ghost{opacity:0!important;pointer-events:none}

.card-in{position:absolute;inset:0;padding:16px 16px 14px 20px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-right:30px}
.card-name{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:21px;line-height:1.15;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.card-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;margin-top:3px}
.card-kcal{text-align:right;flex:none}
.card-kcal b{font-family:var(--mono);font-size:25px;font-weight:600;color:var(--ink);line-height:1}
.card-kcal span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.14em;margin-top:2px}
.card-kcal.pending b{font-family:var(--font);font-size:15px;color:var(--seal);letter-spacing:.04em}

.card-mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 宏量：打孔刻度条（die-cut 冲孔网格，借 Tear Ticket 齿孔语言）——已摄入部分冲成透桌暗孔，余下保持纸面；
   读数另附油墨数字。避免标准 web 进度条模板味 */
.card-mac{margin-top:auto;display:flex;flex-direction:column;gap:7px;padding:2px 0 4px}
.mac-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}
.mac-row .ml{width:30px;flex:none;letter-spacing:.02em}
.mac-row .ruler{flex:1;height:9px;position:relative;
  background:
    radial-gradient(circle, rgba(30,22,14,.9) 0 1.7px, transparent 2.1px) 0 center/7px 9px repeat-x;
  -webkit-mask:linear-gradient(90deg,#000 0 var(--fill,0%),rgba(0,0,0,.14) var(--fill,0%) 100%);
  mask:linear-gradient(90deg,#000 0 var(--fill,0%),rgba(0,0,0,.14) var(--fill,0%) 100%)}
.mac-row .ruler::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;
  background:repeating-linear-gradient(90deg, rgba(120,96,64,.5) 0 1px, transparent 1px 7px)}
.mac-row .mv{width:46px;flex:none;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-2);font-weight:500}
.mac-row.na .ruler{background:repeating-linear-gradient(90deg,rgba(120,96,64,.25) 0 2px,transparent 2px 6px);-webkit-mask:none;mask:none;height:7px}
.mac-row.na .mv{color:var(--seal)}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:9px;border-top:1px dashed rgba(120,96,64,.4)}
.card-foot .src{font-size:11px;color:var(--ink-3);line-height:1.4;max-width:58%}
.card-foot .per{font-size:11px;color:var(--ink-2);text-align:right;line-height:1.5}
.card-foot .per b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* 胶带：钉住卡片的手工感 */
.tape{
  position:absolute;top:-9px;left:34px;width:64px;height:19px;transform:rotate(-4deg);
  background:linear-gradient(180deg,rgba(232,203,152,.88),rgba(214,180,124,.82));
  box-shadow:0 1px 2px rgba(0,0,0,.18);
  z-index:3;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 3.6px);
  mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 3.6px);
}
/* 右缘“可推开”撕口暗示 */
.peel{position:absolute;right:0;top:0;bottom:0;width:14px;z-index:2;background:linear-gradient(90deg,transparent,rgba(120,96,64,.10));border-radius:0 10px 10px 0}
.peel::after{content:"";position:absolute;right:5px;top:50%;width:5px;height:5px;border-right:1.5px solid rgba(122,110,99,.6);border-top:1.5px solid rgba(122,110,99,.6);transform:translateY(-50%) rotate(45deg)}

/* 深层卡只露出一个紧凑表头，刚好落在露出条带内，数字不被下一张卡切掉 */
.dish-card.is-deep .card-in{padding:6px 14px 6px 16px;gap:0}
.dish-card.is-deep .card-mid,.dish-card.is-deep .card-foot,.dish-card.is-deep .peel,.dish-card.is-deep .card-mac{display:none}
.dish-card.is-deep .card-head{align-items:center;padding-right:20px}
.dish-card.is-deep .card-name{font-size:14px;line-height:1.1;font-family:var(--font);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dish-card.is-deep .card-sub{display:none}
.dish-card.is-deep .card-kcal b{font-size:14px;line-height:1.1}
.dish-card.is-deep .card-kcal span{display:none}
.dish-card.is-deep .tape{display:none}
/* 被隐藏的更老菜卡：画成这叠卡底部一摞加厚侧边（层叠棱边），计数长在卡堆上而非浮字 */
/* cf-justify: 被隐藏的更老菜卡画成这叠底部一摞加厚侧边，圆角是纸卡切角，属母题 */
.deck-slab{display:none;position:absolute;left:10px;right:10px;top:calc(-1 * var(--rise,0px));border-radius:6px;
  background:
    repeating-linear-gradient(180deg, rgba(120,96,64,.30) 0 1px, rgba(243,236,221,.9) 1px 3px, rgba(203,187,160,.9) 3px 4px),
    linear-gradient(180deg,var(--paper),var(--paper-lo));
  box-shadow:0 3px 0 rgba(120,96,64,.4),0 10px 20px rgba(6,4,2,.4);
  transform:translateZ(-140px) scale(.94);transform-origin:50% 0;z-index:1}
.deck-slab span{position:absolute;left:14px;bottom:9px;font-size:11px;color:var(--ink-2);letter-spacing:.04em;
  background:var(--paper-hi);padding:2px 7px;border-radius:3px;border:1px solid rgba(120,96,64,.3)}

/* 份量芯片：硬纸卡上的刻位 */
.chip{
  border:1px solid rgba(90,70,44,.35);background:rgba(255,255,255,.34);
  color:var(--ink-2);border-radius:5px;padding:5px 9px;font-size:11.5px;line-height:1;
  font-family:var(--font);letter-spacing:.02em;cursor:pointer;transition:transform .16s,background .2s,color .2s;
}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.94)}
.grams-edit{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3)}
.grams-edit b{font-family:var(--mono);color:var(--ink);font-size:12.5px}

/* ============ 小票纸带 ============ */
/* filter: drop-shadow 跟随「本体+撕齿」的锯齿轮廓落影（借 React Bits Tear Ticket 的齿孔撕线 + trevornoah 卷纸明暗），
   box-shadow 只会投矩形，故阴影改挂在 wrapper 上 */
.tape-wrap{position:relative;margin:22px auto 0;width:calc(100% - 34px);max-width:330px;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.34)) drop-shadow(0 2px 3px rgba(0,0,0,.22));
  transition:transform .45s cubic-bezier(.2,1.1,.3,1),opacity .4s ease}
.tape-wrap.tearing{transform:translateY(70%) rotate(2.5deg);opacity:0}
/* cf-justify: 热敏小票纸带，形状由撕齿上缘与穿孔撕线定义，是本方向「一餐账单」的物理载体 */
/* 撕齿直接切在纸体上（mask 作用于本体）：中段实心 + 上下两段只留齿列，并集即得锯齿轮廓；
   wrapper 的 drop-shadow 便自然跟随这条锯齿轮廓落影，无「变色贴条」接缝 */
.receipt{
  position:relative;--tooth:7px;
  background:linear-gradient(180deg,#fbf7ec,#f4ecda 60%,#eee3cd);
  color:var(--ink);border-radius:0;
  padding:calc(15px + var(--tooth)) 16px calc(13px + var(--tooth));
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
  text-shadow:none;
  -webkit-mask:
    linear-gradient(#000,#000) center / 100% calc(100% - var(--tooth) * 2) no-repeat,
    repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 10px) center / 100% 100% no-repeat;
  mask:
    linear-gradient(#000,#000) center / 100% calc(100% - var(--tooth) * 2) no-repeat,
    repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 10px) center / 100% 100% no-repeat;
}
/* 穿孔撕线：一排打穿、钉在撕线中轴上的圆孔，孔即撕线本身（不再另画虚线） */
.perf{height:0;border:0;position:relative;margin:20px -16px 18px}
.perf::before{content:"";position:absolute;left:0;right:0;top:-5px;height:10px;
  background:radial-gradient(circle, var(--table) 0 2.4px, transparent 2.9px) center/13px 10px repeat-x}
.rc-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.rc-total{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 2px}
.rc-total .k{font-size:12px;color:var(--ink-3);letter-spacing:.2em;align-self:center}
.rc-total .v{font-family:var(--mono);font-size:46px;line-height:.86;font-weight:600;color:var(--ink);letter-spacing:-.03em}
.rc-total .v small{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:.06em;margin-left:4px}
.rc-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px}
.rc-macros div{padding:7px 0 5px;border-top:1px solid rgba(90,70,44,.22);border-right:1px solid rgba(90,70,44,.16)}
.rc-macros div:last-child{border-right:0}
.rc-macros b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink)}
.rc-macros span{font-size:11px;color:var(--ink-3);letter-spacing:.12em}
.rc-macros .na b{font-family:var(--font);font-size:12px;color:var(--ink-3);font-weight:400}
.rc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.rc-src{font-size:11px;color:var(--ink-3);line-height:1.5;max-width:56%;flex:none}
/* 橡皮章：不规则墨迹边 + 轻微重印偏移，不再是一个均匀圆角标签 */
.stamp{
  position:relative;font-family:"Songti SC",serif;font-weight:700;color:var(--seal);
  padding:4px 10px;font-size:12px;letter-spacing:.16em;transform:rotate(-7deg);
  opacity:.9;mix-blend-mode:multiply;text-shadow:.5px .5px 0 rgba(168,50,42,.18);
  -webkit-mask:
    radial-gradient(circle at 3px 50%, #000 1.6px, transparent 2.1px) left / 6px 100% repeat-x,
    radial-gradient(circle at calc(100% - 3px) 50%, #000 1.6px, transparent 2.1px) right / 6px 100% repeat-x,
    linear-gradient(#000,#000) center / calc(100% - 8px) 100% no-repeat;
  mask:
    radial-gradient(circle at 3px 50%, #000 1.6px, transparent 2.1px) left / 6px 100% repeat-x,
    radial-gradient(circle at calc(100% - 3px) 50%, #000 1.6px, transparent 2.1px) right / 6px 100% repeat-x,
    linear-gradient(#000,#000) center / calc(100% - 8px) 100% no-repeat;
}
.stamp::before{content:"";position:absolute;inset:0;border:2px solid var(--seal);mask:inherit;-webkit-mask:inherit;opacity:.9}
.stamp.pending{color:var(--accent)}
.stamp.pending::before{border-color:var(--accent)}
.rc-empty{font-size:12.5px;color:var(--ink-3);text-align:center;padding:10px 0 4px;line-height:1.6}

/* ============ 底部操作坞 + 快门 ============ */
.dock{position:sticky;bottom:0;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 4px calc(10px + var(--safe-b));background:linear-gradient(180deg,#241f1a,#1b1712);
  border-top:1px solid rgba(201,162,95,.28);box-shadow:0 -8px 18px rgba(6,4,2,.5)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(201,162,95,.4);background:rgba(201,162,95,.08);

.tstack{position:relative;perspective:900px;padding-bottom:6px}

  /* 侧壁：三层硬偏移暗影 + 底缘受光亮线，读作切出来的纸厚 */
  box-shadow:0 1px 0 rgba(255,250,238,.9),0 3px 0 rgba(120,96,64,.55),0 5px 0 rgba(176,150,112,.9),0 8px 14px rgba(6,4,2,.34);

/* 未记录餐次：一个空卡槽/文件夹标签剪口，明示「这里还能叠」（借 Magic UI Folder 的标签形态） */

/* 提示 toast：一张被拍在桌上的小纸条（直角撕边 + 投影 + 轻旋转），与印章同源 */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px) rotate(-1.5deg);z-index:200;
  background:linear-gradient(180deg,var(--paper-hi),var(--paper));color:var(--ink);font-size:12.5px;font-weight:500;
  padding:9px 15px 10px;border-radius:2px;border-left:3px solid var(--brass);
  box-shadow:0 8px 22px rgba(0,0,0,.45),0 1px 0 rgba(120,96,64,.3);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;white-space:nowrap}
.toast::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:inherit;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 8px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 8px)}
.toast.show{opacity:1;transform:translate(-50%,0) rotate(-1.5deg)}

@media (max-width:374px){
  .wrap{padding:0 13px}
  .card-name{font-size:19px}
  .card-kcal b{font-size:22px}
  .rc-total .v{font-size:40px}
  .result-hero .rh-kcal b{font-size:46px}
  .week-strip{gap:4px}
  .wk-card{height:11px}
  .wk-bar{height:112px}
  .topbar{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){
  .dish-card,.chip,.btn-ghost,.shutter,.dt-body,.nav button,.wk-card,.tape-wrap,.toast,.tcard{transition-duration:.01ms!important}
  .dish-card{will-change:auto}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===================== 今日 ===================== -->
  <section class="screen is-on" id="scr-today" aria-label="今日">
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><b>卡路里拍立得</b><span>北京邮电大学 · 食堂记录</span></div>

      </div>
      <div class="rule"></div>
      <div class="page-h">
        <h1>今日</h1>
        <span class="sub" id="today-count">还没有记录</span>
      </div>
      <div id="today-list"></div>
      <div class="empty-deck" id="today-empty">
        <div class="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg></div>
        <div class="ghost-card" style="--i:2"></div>
        <div class="ghost-card" style="--i:1"></div>
        <div class="ghost-card" style="--i:0"></div>
        <div class="hint">
          <p>今天还没有记录</p>
          <small>拍下这一餐，一道一道叠上去</small>

    </div>
    <div class="dock">
      <button class="btn-ghost" data-go="week">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3v3M17 3v3M4 9h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/></svg>
        看这一周
      </button>
      <button class="shutter" data-go="new" aria-label="拍照记录一餐">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </button>
      <div style="width:78px;text-align:right"><span style="font-size:11px;color:var(--cream-72);letter-spacing:.04em;line-height:1.4;display:inline-block">拍照<br>记一餐</span></div>
    </div>
  </section>

  <!-- ===================== 新建一餐 ===================== -->
  <section class="screen" id="scr-new" aria-label="新建一餐">
    <div class="wrap">
      <div class="topbar">
        <div class="brand"><b>新建一餐</b><span id="new-slot">午餐 · 今天</span></div>
        <button class="btn-ghost" data-go="today" style="padding:8px 12px">收起</button>
      </div>
      <div class="rule"></div>
      <div class="stage" id="stage">
        <div class="deck-slab" id="deck-slab"></div>
        <div class="deck" id="deck"></div>

          <div style="text-align:center;color:var(--cream-72);font-size:12.5px;line-height:1.7;padding-bottom:10px">
            <div style="font-size:13px;color:var(--cream);margin-bottom:4px">菜还没叠上来</div>
            先拍一张，或从下面搜索添加
          </div>

    <div class="dock">

        搜索添加
      </button>
      <button class="shutter" id="btn-shoot" aria-label="拍一道菜">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>

      </div>

      <div class="week-strip" id="week-strip"></div>

  </section>

  <nav class="nav" id="nav">
    <button data-go="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 10v9h12v-9"/></svg>今日</button>
    <button data-go="new"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2h6.8L17 8h3v11H4V8Z"/><circle cx="12" cy="13" r="3.2"/></svg>记录</button>
    <button data-go="result"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6V3Z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>明细</button>
    <button data-go="week"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-7M22 20H2"/></svg>这周</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   卡路里拍立得 · 方向 C「层叠」探索试样
   母题：一餐 = 一叠可推开的菜卡；热量随卡叠合而变。
   零依赖、零网络；营养按项目 nutrition.ts 同口径在前端算。
   全部动效只改 transform/opacity。
   ============================================================ */
(function(){
'use strict';

/* ---------- 菜品库（与 docs/PRD 同类的校园食堂样例，每 100g 数据） ---------- */
var CAT = {
  '主食':{c:'var(--c-staple)'}, '荤菜':{c:'var(--c-meat)'}, '蔬菜':{c:'var(--c-veg)'},
  '蛋豆':{c:'var(--c-egg)'}, '汤':{c:'var(--c-soup)'}, '其他':{c:'var(--c-other)'}
};
// kcal,protein,fat,carbs per 100g；null=暂无数据
var DISHES = [
  {id:'rice',    name:'米饭',       cat:'主食', cook:'蒸', per:[116,2.6,0.3,25.9], portions:[['标准份',200],['半份',100],['小份',150]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11 北邮学一'},
  {id:'tomatoegg',name:'番茄炒蛋',  cat:'蛋豆', cook:'炒', per:[86,4.9,5.6,4.3],  portions:[['标准份',180],['半份',90]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'greens',  name:'清炒青菜',   cat:'蔬菜', cook:'炒', per:[48,1.8,3.2,3.0],  portions:[['标准份',150],['半份',75]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'braised', name:'红烧肉',     cat:'荤菜', cook:'炖', per:[478,9.6,45.0,6.0], portions:[['标准份',120],['半份',60]], src:'中国食物成分表 第6版·近似', psrc:'团队称重 2026-11', range:[430,540], rnote:'用油量与肥瘦比差异'},
  {id:'chicken', name:'宫保鸡丁',   cat:'荤菜', cook:'炒', per:[192,15.0,12.0,7.0], portions:[['标准份',150],['半份',75]], src:'中国食物成分表 第6版·近似', psrc:'团队称重 2026-11'},
  {id:'potato',  name:'醋溜土豆丝', cat:'蔬菜', cook:'炒', per:[122,2.0,7.5,12.0], portions:[['标准份',150],['半份',75]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'tofu',    name:'家常豆腐',   cat:'蛋豆', cook:'烧', per:[140,8.9,9.5,5.0],  portions:[['标准份',160],['半份',80]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'soup',    name:'紫菜蛋花汤', cat:'汤',   cook:'煮', per:[22,1.6,1.0,1.8],  portions:[['一碗',300],['半碗',150]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'noodle',  name:'手擀面',     cat:'主食', cook:'煮', per:[138,4.5,1.0,28.0], portions:[['标准份',250],['半份',125]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'fish',    name:'酸菜鱼',     cat:'荤菜', cook:'煮', per:[158,14.5,9.8,3.5], portions:[['标准份',180],['半份',90]], src:'中国食物成分表 第6版·近似', psrc:'团队称重 2026-11', range:[130,190], rnote:'汤底含油与鱼肉比例'},
  {id:'pumpkin', name:'南瓜粥',     cat:'主食', cook:'煮', per:[44,0.8,0.2,9.5],  portions:[['一碗',300],['半碗',150]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'mystery', name:'手抓饼加蛋', cat:'其他', cook:'煎', per:[null,null,null,null], portions:[['一份',160]], src:'暂无数据', psrc:'待补充'}
];
var BY_ID = {}; DISHES.forEach(function(d){ BY_ID[d.id]=d; });
var SLOT_LABEL = {breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'};
var WD = ['日','一','二','三','四','五','六'];

/* ---------- 营养计算：与 src/domain/nutrition.ts 同口径 ---------- */
function seq(n){ return Math.round(n*10)/10; }
function scaleN(per, grams){
  if(!(grams>0)) return [null,null,null,null];
  var f = grams/100; return per.map(function(v){ return v==null?null:v*f; });
}
function roundN(a){ return a.map(function(v,i){ return v==null?null:(i===0?Math.round(v):seq(v)); }); }
function computeItem(dish, grams, label){
  var n = roundN(scaleN(dish.per, grams));
  return { dishId:dish.id, name:dish.name, cat:dish.cat, cook:dish.cook, src:dish.src, psrc:dish.psrc,
           per100:dish.per,
           grams:grams, label:label, pending:n[0]==null, n:[n[0],n[1],n[2],n[3]],
           range: dish.range?[Math.round(dish.range[0]*grams/100),Math.round(dish.range[1]*grams/100)]:null,
           rnote:dish.rnote };
}
function summarize(items){
  var kcal=0, pend=0, p=0,f=0,c=0, pok=1,fok=1,cok=1;
  items.forEach(function(it){
    if(it.pending||it.n[0]==null){ pend++; } else { kcal+=it.n[0]; }
    if(it.n[1]==null) pok=0; else p+=it.n[1];
    if(it.n[2]==null) fok=0; else f+=it.n[2];
    if(it.n[3]==null) cok=0; else c+=it.n[3];
  });
  return { kcal:Math.round(kcal), protein: pok&&items.length?seq(p):null, fat: fok&&items.length?seq(f):null,
           carbs: cok&&items.length?seq(c):null, pendingCount:pend, itemCount:items.length };
}
function fmtG(g){ return Number.isInteger(g)?String(g):String(Math.round(g*10)/10); }
function catColor(cat){ return (CAT[cat]||CAT['其他']).c; }
/* ---------- 状态 ---------- */
var state = {
  screen:'today',
  draft:[],          // 当前新建的一餐
  saved:[],          // 今日已保存的餐
  slot:'lunch'
};
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

/* 初始状态：默认「今日」为空，直接展示设计的空状态。
   加 ?demo=1 预置一份早餐，便于审阅「今日」有记录时的样子。 */
function seed(){
  var demo = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);
  if(!demo) return;
  var b = [ computeItem(BY_ID['pumpkin'],300,'一碗'), computeItem(BY_ID['tomatoegg'],90,'半份') ];
  state.saved = [{ id:'m1', date:'today', time:'07:50', slot:'breakfast', items:b }];
}

/* ---------- 屏幕切换 ---------- */
var SCREENS = ['today','new','result','week'];
function go(name){
  state.screen = name;
  SCREENS.forEach(function(s){ el('scr-'+s).classList.toggle('is-on', s===name); });
  Array.prototype.forEach.call(el('nav').children, function(b){ b.classList.toggle('on', b.getAttribute('data-go')===name); });
  el('scr-'+name).scrollTop = 0;
  if(name==='today') renderToday();
  if(name==='new') renderNew();
  if(name==='week') renderWeek();
  if(name==='result') renderResult();
}

/* ---------- 卡片 HTML ---------- */
function macRow(label, val, max, unit, cat){
  if(val==null) return '<div class="mac-row na"><span class="ml">'+label+'</span><span class="ruler"></span><span class="mv">暂无</span></div>';
  var pct = max>0 ? Math.min(100, Math.round(val/max*100)) : 0;
  return '<div class="mac-row"><span class="ml">'+label+'</span><span class="ruler" style="--fill:'+pct+'%"></span><span class="mv">'+val+unit+'</span></div>';
}
function macroBars(it){
  if(it.pending) return '';
  var n=it.n;
  var max = Math.max(n[1]||0, n[2]||0, n[3]||0, 1);
  return '<div class="card-mac">'
    + macRow('蛋白', n[1], max, 'g', catColor(it.cat))
    + macRow('脂肪', n[2], max, 'g', catColor(it.cat))
    + macRow('碳水', n[3], max, 'g', catColor(it.cat))
    + '</div>';
}

function cardHTML(it, v, realIdx, ty, band){
  var cat = catColor(it.cat);
  var pending = it.pending;
  var kcalHTML = pending
    ? '<div class="card-kcal pending"><b>待估算</b><span>无热量数据</span></div>'
    : '<div class="card-kcal"><b>'+it.n[0]+'</b><span>千卡</span></div>';
  return '<article class="dish-card'+(v>0?' is-deep':' is-front')+'" data-i="'+v+'" data-real="'+realIdx+'" '
    + 'style="--i:'+v+';--cat:'+cat+';--ty:'+ty+'px;--band:'+band+'px">'
    + '<div class="tape"></div><div class="peel"></div><div class="grommet"></div>'
    + '<div class="card-in">'
    +   '<div class="card-head"><div>'
    +     '<div class="card-name">'+esc(it.name)+'</div>'
    +     '<div class="card-sub">'+esc(it.cook)+' · '+esc(it.cat)+' · 实吃 '+fmtG(it.grams)+' 克</div>'
    +   '</div>'+kcalHTML+'</div>'
    +   macroBars(it)
    +   '<div class="card-mid" data-portions="'+realIdx+'"></div>'
    +   '<div class="card-foot">'
    +     '<div class="src">'+esc(it.psrc)+'</div>'
    +     '<div class="per">'+ (pending
            ? '每 100 克 · <b>暂无数据</b>'
            : '每 100 克 <b>'+it.per100[0]+'</b> 千卡') +'</div>'
    +   '</div>'
    + '</div></article>';
}

/* ---------- 新建页渲染 ---------- */
function renderNew(){
  var deck = el('deck'), empty = el('deck-empty');
  var n = state.draft.length;
  el('new-slot').textContent = SLOT_LABEL[state.slot] + ' · 今天';
  empty.style.display = n? 'none':'flex';
  // 最多绘制 4 层；更老的菜汇总成一摞加厚侧边（仍属于这叠卡，不是浮字），保性能不改承诺。
  var shown = Math.min(n,4);
  var hidden = n - shown;
  // 卡厚：band(px) = 30 + 千卡*0.095，钳在 30–74；越靠后的卡按「前面所有卡的 band 之和」向上抬升，
  // 于是每张被压的卡在顶部露出一条 band 高的表头，整摞总高 ∝ 整餐热量。
  function band(it){ if(it.pending||it.n[0]==null) return 46; return Math.max(30, Math.min(74, 30 + it.n[0]*0.095)); }
  var html = '';
  // 先算每张的 band（按视觉层 0=最新顶卡）
  var bands = [];
  for(var vv=0; vv<shown; vv++){ bands.push(band(state.draft[n-1-vv])); }
  var prefix = 0; // 已露出条带的累加；顶卡(vis0)整张可见，之后每张按自身 band 上抬，露出条带=自身厚度
  var maxRise = 0;
  for(var vis = 0; vis < shown; vis++){
    var realIdx = n-1-vis;
    var it = state.draft[realIdx];
    if(vis>0){ prefix += bands[vis]; maxRise = prefix; }
    var ty = -prefix;         // 顶卡 ty=0，后面的卡依次按自身厚度上抬
    html += cardHTML(it, vis, realIdx, ty, bands[vis]);
  }
  deck.innerHTML = html;
  // 隐藏层的加厚侧边：画在最底层卡的左侧，写成“共 N 道”露角折标
  var slab = el('deck-slab');
  if(hidden>0){
    slab.style.display='block';
    slab.style.height = (46 + hidden*10) + 'px';
    slab.dataset.n = hidden;
    slab.innerHTML = '<span>下面还垫着 '+hidden+' 道</span>';
  } else { slab.style.display='none'; }
  // 抬升量决定舞台顶部留白，保证最上层卡不被顶栏切
  el('stage').style.setProperty('--rise', (maxRise + 10)+'px');
  for(var k=0;k<shown;k++){ mountPortions(n-1-k); }
  renderReceipt();
  el('btn-save').disabled = n===0;
  el('save-sub').textContent = n? (n+' 道 · '+sumKlass(state.draft)) : '先加菜';
  el('btn-save').querySelector('b').textContent = n? '结账' : '保存';
  document.querySelector('#scr-new .dock').classList.toggle('has-items', n>0);
  applyPress();
}

function sumKlass(items){
  var s = summarize(items);
  var t = s.kcal + ' 千卡';
  if(s.pendingCount) t += ' · '+s.pendingCount+' 待估算';
  return t;
}

function mountPortions(i){
  var it = state.draft[i]; var host = document.querySelector('[data-portions="'+i+'"]');
  if(!host) return;
  var dish = BY_ID[it.dishId];
  var opts = dish? dish.portions : [['一份', it.grams]];
  var h = '';
  opts.forEach(function(p){
    var on = Math.abs(p[1]-it.grams) < 0.5;
    h += '<button class="chip'+(on?' on':'')+'" data-pick="'+i+'|'+p[1]+'|'+p[0]+'">'+p[0]+'<span style="opacity:.6;margin-left:5px">'+p[1]+'g</span></button>';
  });

/* ---------- 拖动推开卡：横向甩开顶卡即移除 ---------- */
function bindDeckDrag(){
  var deck = el('deck');
  var startX=0, dragging=false, active=null, moved=0, baseW=0, lastT=0, lastX=0, vx=0;
  deck.addEventListener('pointerdown', function(e){
    var card = e.target.closest('.dish-card');
    if(!card) return;
    if(e.target.closest('.chip')) return; // 点份量不拖
    if(card.classList.contains('is-deep')) return; // 只拖顶卡
    active=card; dragging=true; startX=e.clientX; moved=0;
    baseW = deck.clientWidth || 340;
    lastT = performance.now(); lastX = e.clientX; vx = 0; card.__vx = 0;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
    card.style.transition='none';
    card.style.cursor='grabbing';
  });
  deck.addEventListener('pointermove', function(e){
    if(!dragging||!active) return;
    var dx = e.clientX - startX; moved=Math.abs(dx);
    var now = performance.now(), dt = now - lastT;
    if(dt > 8){ vx = Math.abs(e.clientX - lastX) / dt; lastX = e.clientX; lastT = now; active.__vx = vx; }
    active.style.setProperty('--dx', dx+'px');
    active.style.setProperty('--dry', (dx/baseW*18)+'deg');
    active.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx)/baseW*0.9));
  });
  function end(){
    if(!dragging||!active) return;
    var dx = parseFloat(active.style.getPropertyValue('--dx'))||0;
    var idx = parseInt(active.dataset.real,10);
    active.style.transition='';
    active.style.cursor='';
    // 阈值提到 40%，并需真正的“甩”速（最近 90ms 内位移速度），慢拖到位不算，降低误删
    var vel = Math.abs(active.__vx||0);
    var flung = Math.abs(dx) > (deck.clientWidth||340)*0.40 && vel > 0.35;
    if(flung){
      var it = state.draft[idx];
      // 甩出：先滑走再移除
      active.style.setProperty('--dx',(dx>0?1:-1)*480+'px');
      active.style.setProperty('--dry',(dx>0?1:-1)*30+'deg');
      active.style.opacity='0';
      setTimeout(function(){
        state.draft.splice(idx,1);
        renderNew();
        // 可撤销纸条，停留约 4 秒
        toastAction('已移出「'+it.name+'」','撤销',function(){
          state.draft.splice(idx,0,it); renderNew();
        });
      }, 230);
    } else {
      // 弹回
      active.style.setProperty('--dx','0px');
      active.style.setProperty('--dry','0deg');
      active.style.opacity='';
    }
    dragging=false; active=null;
  }
  deck.addEventListener('pointerup', end);
  deck.addEventListener('pointercancel', end);
  // 轻点顶卡：翻到最上层查看（此处即“选中最上层”即已在上层，改为提示）
  deck.addEventListener('click', function(e){
    if(moved>8) return;
    var chip = e.target.closest('.chip');
    if(chip && chip.dataset.pick){ pickPortion(chip.dataset.pick); return; }
  });
}
function pickPortion(spec){
  var parts = spec.split('|');
  var i = parseInt(parts[0],10), grams = parseFloat(parts[1]), label = parts[2];
  var it = state.draft[i]; if(!it) return;
  var dish = BY_ID[it.dishId];
  var fresh = computeItem(dish, grams, label);
  state.draft[i] = fresh;
  renderNew();
  toast(it.name+' · '+fmtG(grams)+' 克 → '+ (fresh.pending?'待估算':fresh.n[0]+' 千卡'));
}

/* ---------- 拍照模拟：加入一道菜，卡片从下方叠上来 ---------- */
var SHOOT_QUEUE = ['braised','greens','tomatoegg','chicken','tofu','potato','soup','fish','pumpkin','noodle','rice','mystery'];
var shootPtr = 0;
function shoot(){
  // 找一道还没加入的菜
  var used = {}; state.draft.forEach(function(it){ used[it.dishId]=1; });
  var pick=null;
  for(var k=0;k<SHOOT_QUEUE.length;k++){
    var id = SHOOT_QUEUE[(shootPtr+k)%SHOOT_QUEUE.length];
    if(!used[id]){ pick=BY_ID[id]; shootPtr=(shootPtr+k+1)%SHOOT_QUEUE.length; break; }
  }
  if(!pick){ pick=BY_ID['greens']; }
  var p = pick.portions[0];
  var item = computeItem(pick, p[1], p[0]);
  state.draft.push(item);
  renderNew();
  // 入场：新顶卡从下方浮起并淡入（只动 transform/opacity）
  var top = el('deck').querySelector('.dish-card[data-i="0"]');
  if(top){
    top.animate(
      [{transform:'translateY(46px) scale(.96)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],
      {duration:460, easing:'cubic-bezier(.2,1.05,.32,1)'}
    );
  }
  toast('已叠上「'+pick.name+'」'+(item.pending?' · 待估算':(' · '+item.n[0]+' 千卡')));
  // 相机快门白闪
  flash();
}
function flash(){
  var f = document.createElement('div');
  f.style.cssText='position:fixed;inset:0;background:rgba(255,248,232,.5);z-index:300;pointer-events:none;opacity:1;transition:opacity .28s ease';
  document.body.appendChild(f);
  requestAnimationFrame(function(){ f.style.opacity='0'; });
  setTimeout(function(){ f.remove(); }, 340);
}

  var list = DISHES.filter(function(d){ return !used[d.id]; });
  var wrap = document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;z-index:250;display:flex;align-items:flex-end;background:rgba(10,8,6,.5);backdrop-filter:blur(2px)';
  var panel = document.createElement('div');
  // 搜索面板也走纸面母语：一张从底部抽上来的长条纸卡，撕齿上缘，不用暗色圆角弹层
  panel.style.cssText='position:relative;width:100%;max-width:440px;margin:0 auto;background:linear-gradient(180deg,#fbf7ec,#f4ecda 70%,#eee3cd);color:var(--ink);border-radius:2px 2px 0 0;padding:16px 16px calc(20px + var(--safe-b));max-height:74vh;overflow:auto;box-shadow:0 -8px 26px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset';
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    + '<b style="font-family:&quot;Songti SC&quot;,serif;font-size:17px;color:var(--ink)">搜一道菜加进来</b>'
    + '<button id="sp-close" style="border:0;background:none;color:var(--ink-3);font-size:13px;cursor:pointer">关闭</button></div>';
  list.forEach(function(d){
    var pend = d.per[0]==null;
    h += '<button class="sp-item" data-add="'+d.id+'" style="display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1px solid rgba(120,96,64,.28);border-left:5px solid '+catColor(d.cat)+';background:linear-gradient(180deg,#fbf7ec,#f3ecd9);border-radius:2px 7px 7px 2px;padding:10px 11px;margin-bottom:7px;color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(120,96,64,.25)">'
      + '<span style="flex:1"><b style="font-size:13.5px;font-weight:600;font-family:&quot;Songti SC&quot;,serif">'+esc(d.name)+'</b>'
      + '<span style="display:block;font-size:11px;color:var(--ink-3);margin-top:1px">'+esc(d.cook)+' · '+esc(d.cat)+' · '+(pend?'暂无热量数据':d.per[0]+' 千卡/100g')+'</span></span>'
      + '<span style="font-family:var(--mono);font-size:12px;color:var(--ink-2)">'+d.portions[0][1]+'g</span></button>';
  });
  panel.innerHTML = h;
  wrap.appendChild(panel);
  document.body.appendChild(wrap);
  wrap.addEventListener('click', function(e){ if(e.target===wrap) wrap.remove(); });
  el('sp-close').addEventListener('click', function(){ wrap.remove(); });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-add]'), function(b){
    b.addEventListener('click', function(){
      var d = BY_ID[b.dataset.add]; var p=d.portions[0];
      state.draft.push(computeItem(d, p[1], p[0]));
      wrap.remove(); renderNew();
      var item = state.draft[state.draft.length-1];
      toast('已叠上「'+d.name+'」'+(item.pending?' · 待估算':(' · '+item.n[0]+' 千卡')));
    });
  });
}

/* ---------- 保存 ---------- */
function saveMeal(){
  if(!state.draft.length) return;
  var items = state.draft.slice();
  state.saved.push({ id:'m'+Date.now(), date:'today', time:'12:10', slot:state.slot, items:items });
  state.viewMeal = state.saved[state.saved.length-1]; state.isDraft=false;
  state.draft = [];
  renderNew();
  go('result');
  toast('已保存这一餐 · '+summarize(items).kcal+' 千卡');
}

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  var t = el('toast'); t.innerHTML=''; t.textContent=msg; t.classList.add('show');
  t.style.cursor='default'; t.style.pointerEvents='none';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
/* 带撤销按钮的纸条，停留约 4 秒 */
function toastAction(msg, actionLabel, onAction){
  var t = el('toast');
  t.innerHTML = '<span style="display:inline-flex;align-items:center;gap:12px">'+esc(msg)
    + '<button id="toast-act" style="border:0;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;'
    + 'border-radius:4px;padding:5px 11px;cursor:pointer;letter-spacing:.05em">'+esc(actionLabel)+'</button></span>';
  t.style.pointerEvents='auto'; t.style.cursor='default';
  t.classList.add('show');
  clearTimeout(toastTimer);
  var hide=function(){ t.classList.remove('show'); t.style.pointerEvents='none'; };
  toastTimer=setTimeout(hide, 4000);
  var btn = el('toast-act');
  btn.addEventListener('click', function(){ clearTimeout(toastTimer); onAction(); hide(); });
}

/* ---------- 绑定 ---------- */
function boot(){
  seed();
  // 导航
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-go')); });
  });
  el('btn-search').addEventListener('click', openSearch);
  el('btn-shoot').addEventListener('click', shoot);
  el('btn-save').addEventListener('click', saveMeal);
  bindDeckDrag();
  renderToday(); renderNew();
  // 初始显示今日
  go('today');
}
boot();

})();
</script>
