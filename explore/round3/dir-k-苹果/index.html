<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>卡路里拍立得</title>
<style>
/* ============================================================
   令牌系统（先建令牌，再铺界面）
   间距：4 的倍数。页边距 16，卡内边距 16，行内边距 16，行高最小 44。
   圆角：大卡 24，内块 14，胶囊 980。容器形状只用这三种。
   字号：SF Pro 层级，大标题 34、标题 22、正文 17、次级 15、脚注 13、说明 12、最小 11。
   字重：只有 Regular 400、Semibold 600、Bold 700 三档，没有 500。
   cf-justify: 白色大圆角卡是 iOS「分组列表」的固有容器语言，圆角与 24 令牌一致，不做异形。
   ============================================================ */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-card:24px; --r-tile:14px; --r-btn:14px; --r-pill:980px;
  --fs-xl:34px; --fs-lg:22px; --fs-md:17px; --fs-sm:15px;
  --fs-foot:13px; --fs-cap:12px; --fs-min:11px;
  --bg:#F2F2F7; --card:#FFFFFF;
  --lbl:#000000; --lbl2:rgba(60,60,67,.6); --lbl3:rgba(60,60,67,.32); --lbl4:rgba(60,60,67,.18);
  --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.07);
  --blue:#007AFF; --orange:#FF9500; --teal:#30B0C7; --green:#34C759; --red:#FF3B30;
  --gray:#C7C7CC;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--lbl);
  font-family:var(--font); font-size:var(--fs-md); line-height:1.35;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  /* iOS 应用外壳：内容区与底部标签栏是上下分居的两块，标签栏不覆盖内容 */
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;-webkit-appearance:none}
h1,h2,h3,p,dl,dd,dt{margin:0;font-weight:inherit}
svg{display:block}

/* 内容区自身滚动，底边止于标签栏上沿；滚到底时最后一块完整露出 */
.app{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;width:100%;max-width:430px;margin:0 auto;padding-bottom:10px}
.screen{display:none}
.screen.on{display:block;animation:enter .26s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 导航栏 ---------- */
.nav{
  position:sticky;top:0;z-index:30;
  display:grid;grid-template-columns:minmax(44px,auto) 1fr minmax(44px,auto);align-items:center;
  gap:var(--s2);min-height:44px;padding:6px var(--s4);
  background:rgba(242,242,247,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
.nav h2{font-size:var(--fs-md);font-weight:600;text-align:center;letter-spacing:0}
/* cf-justify: iOS 大标题折叠 —— 停在顶部时只显示大标题，上滑后小标题淡入 */
.nav-mini{opacity:0;transition:opacity .18s linear}
.scrolled .nav-mini{opacity:1}
.nav .slot-l{justify-self:start}
.nav .slot-r{justify-self:end}
/* cf-justify: iOS 导航栏胶囊按钮（UINavigationBarButton）的固有形态，44×44 热区与液态玻璃底 */
.glass{
  width:44px;height:44px;border-radius:var(--r-pill);
  display:grid;place-items:center;color:var(--blue);
  background:rgba(255,255,255,.72);
  border:.5px solid rgba(0,0,0,.06);
  box-shadow:0 .5px 1.5px rgba(0,0,0,.07);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transition:transform .18s var(--ease),opacity .18s linear;
}
.glass:active{transform:scale(.94);opacity:.7}
.glass.pill{width:auto;min-width:44px;height:44px;padding:0 var(--s3);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;justify-self:end}

/* ---------- 大标题与分区标题 ---------- */
.head{padding:var(--s1) var(--s4) 0}
.head .row1{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
h1.title{font-size:var(--fs-xl);line-height:1.12;font-weight:700;letter-spacing:-.01em}
.date-note{font-size:var(--fs-sm);color:var(--lbl2);white-space:nowrap}
/* cf-justify: iOS 分组列表的 section header —— 13px Semibold 灰字，随卡片左缩进，与屏幕使用时间一致 */
.sec{
  font-size:var(--fs-foot);line-height:1.3;font-weight:600;color:rgba(60,60,67,.6);
  padding:var(--s5) var(--s4) 6px;
}
.sec:first-of-type{padding-top:var(--s5)}

/* ---------- 卡片与分组列表 ---------- */
.card{background:var(--card);border-radius:var(--r-card);margin:0 var(--s4) 10px;padding:14px}
.grp{background:var(--card);border-radius:var(--r-card);margin:0 var(--s4) var(--s3);overflow:hidden}
.row{
  width:100%;display:flex;align-items:center;gap:var(--s3);
  min-height:44px;padding:11px var(--s4);position:relative;
  font-size:var(--fs-md);transition:background .16s linear;
}
button.row:active{background:rgba(0,0,0,.045)}
.row+.row::before{content:"";position:absolute;left:var(--s4);right:0;top:0;height:.5px;background:var(--sep)}
.r-main{flex:1;min-width:0}
.r-name{font-size:var(--fs-md);line-height:1.3}
.r-sub{font-size:var(--fs-foot);color:var(--lbl2);margin-top:3px;line-height:1.3}
.r-val{font-size:var(--fs-md);color:var(--lbl2);font-variant-numeric:tabular-nums;white-space:nowrap}
.r-val b{color:var(--lbl);font-weight:400}
.r-val .unit{font-size:var(--fs-foot);margin-left:2px}
.chev{width:8px;height:13px;color:var(--gray);flex:none;transition:transform .2s var(--ease)}
.row .chev{margin-left:var(--s1)}

/* ---------- 数字 ---------- */
.metric{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-left:-2px}
.metric em{font-style:normal;font-size:var(--fs-lg);font-weight:600;margin-left:var(--s1);letter-spacing:0}
.metric-sm{font-size:28px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}
.metric-sm em{font-style:normal;font-size:var(--fs-sm);font-weight:400;margin-left:2px;color:var(--lbl2)}
.t-sub{font-size:var(--fs-sm);color:var(--lbl2);line-height:1.4}
.t-foot{font-size:var(--fs-foot);color:var(--lbl2);line-height:1.45}
.t-cap{font-size:var(--fs-cap);color:var(--lbl2);line-height:1.4}
.num{font-variant-numeric:tabular-nums}

/* ---------- 图表 ---------- */
.chart{display:block;width:100%;height:auto;margin-top:var(--s2)}
.chart text{font-family:var(--font)}
.chart .grid{stroke:#E9E9EE;stroke-width:.7}
.chart .vgrid{stroke:#DCDCE2;stroke-width:.7;stroke-dasharray:2 3}
.chart .axis{stroke:#D1D1D6;stroke-width:.7}
.chart .avg{stroke:#8E8E93;stroke-width:1;stroke-dasharray:4 3}
.chart .ylab{fill:#8E8E93;font-size:11px}
.chart .xlab{fill:#8E8E93;font-size:11px}
.chart .xlab.off{fill:var(--lbl4)}
.chart .ghost{fill:#D1D1D6;opacity:.5}
.chart .b-p{fill:var(--blue)}
.chart .b-f{fill:var(--orange)}
.chart .b-c{fill:var(--teal)}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .55s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);padding:var(--s3) 0 0}
.legend .k{font-size:var(--fs-sm);font-weight:400}
.legend .v{font-size:var(--fs-md);font-weight:400;margin-top:3px;font-variant-numeric:tabular-nums}
.legend .k.p{color:#0062CC} .legend .k.f{color:#C93400} .legend .k.c{color:#0E7C90}
.chart-note{font-size:var(--fs-cap);color:var(--lbl2);line-height:1.5;margin-top:var(--s2)}
/* cf-justify: 图注内的状态记号（图例点），非容器，无圆角矩形语义 */
.dot{display:inline-block;width:7px;height:7px;border-radius:var(--r-pill);background:#D1D1D6;vertical-align:middle;margin:0 3px}
.dot.dot-off{background:none;border:1.2px solid var(--orange)}

/* ---------- 营养构成条 ---------- */
.comp{display:grid;gap:var(--s4);padding:var(--s2) 0 var(--s1)}
.comp-row{display:grid;grid-template-columns:52px 1fr 76px;gap:var(--s3);align-items:center;font-size:var(--fs-foot)}
.comp-row .lab{color:var(--lbl2)}
.comp-row .val{text-align:right;color:var(--lbl);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:var(--r-pill);background:var(--fill);overflow:hidden;display:flex}
.meter i{display:block;height:100%;border-radius:0}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.m-p{background:var(--blue)} .m-f{background:var(--orange)} .m-c{background:var(--teal)}

/* ---------- 详单行 ---------- */
.dish{padding:0}
.dish-hd{width:100%;display:flex;align-items:center;gap:var(--s2);min-height:46px;padding:7px var(--s4);position:relative;transition:background .16s linear}
.dish+.dish::before{content:"";position:absolute;left:var(--s4);right:0;top:0;height:.5px;background:var(--sep)}
.dish-hd:active{background:rgba(0,0,0,.045)}
.dish.open .chev{transform:rotate(90deg)}
.dish-body{display:none;padding:0 var(--s4) 10px}
.dish.open .dish-body{display:block;animation:enter .22s var(--ease)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:5px var(--s4);font-size:var(--fs-foot);line-height:1.35}
.spec dt{color:var(--lbl2)}
.spec dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.spec .range{color:var(--orange)}
.spec .src-note{display:block;margin-top:2px;color:var(--lbl2);line-height:1.35;font-size:var(--fs-cap)}

/* ---------- 拍照入口 ---------- */
.shot{
  display:flex;align-items:center;gap:var(--s4);
  padding:var(--s4);background:var(--card);border-radius:var(--r-card);
  margin:0 var(--s4) var(--s3);transition:background .16s linear;
}
.shot:active{background:#FAFAFC}
/* cf-justify: 图标底板采用 iOS 设置类图标的三分圆角方形（squircle），蓝色 10% 淡底托 SF Symbol */
.shot .glyph{width:56px;height:56px;border-radius:var(--r-tile);background:rgba(0,122,255,.1);color:var(--blue);display:grid;place-items:center;flex:none}
.shot h3{font-size:var(--fs-md);font-weight:600}
.shot p{margin-top:3px;font-size:var(--fs-foot);color:var(--lbl2);line-height:1.35}
.shot .chev{margin-left:auto}
.btn{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  width:100%;min-height:50px;border-radius:var(--r-btn);
  background:var(--blue);color:#fff;font-size:var(--fs-md);font-weight:600;
  transition:transform .16s var(--ease),opacity .16s linear;
}
.btn:active{transform:scale(.985);opacity:.82}
.link{display:flex;align-items:center;justify-content:center;gap:var(--s1);min-height:44px;width:100%;color:var(--blue);font-size:var(--fs-md)}
.link:active{opacity:.6}
.note{font-size:var(--fs-cap);color:var(--lbl2);line-height:1.5;padding:var(--s1) var(--s4) 0}

/* ---------- 建议卡 ---------- */
.advice{display:flex;gap:var(--s3);align-items:flex-start}
/* cf-justify: 提示图标用圆形底，与 iOS 提醒/健康里的圆形符号载体一致 */
.advice .ico{
  width:30px;height:30px;flex:none;border-radius:var(--r-pill);
  display:grid;place-items:center;color:var(--green);background:rgba(52,199,89,.13);
}
.advice h3{font-size:var(--fs-md);font-weight:600;line-height:1.35}
.advice p{margin-top:var(--s1);font-size:var(--fs-sm);color:#3C3C43;line-height:1.5}

/* ---------- 草稿汇总 ---------- */
.sum{
  background:var(--card);border-radius:var(--r-card);margin:var(--s2) var(--s4) var(--s4);
  padding:var(--s4);display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
}
.sum .note{font-size:var(--fs-cap);color:var(--lbl2);margin-top:var(--s1)}
.pill-tag{display:inline-block;font-size:var(--fs-cap);color:var(--lbl2);background:var(--fill2);border-radius:var(--r-pill);padding:2px 8px;line-height:1.4}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:relative;flex:none;width:100%;max-width:430px;margin:0 auto;z-index:40;
  display:flex;padding:6px 0 calc(4px + env(safe-area-inset-bottom));
  background:rgba(249,249,249,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid rgba(0,0,0,.1);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:44px;font-size:var(--fs-min);letter-spacing:.01em;color:#8E8E93;
  transition:color .18s linear;
}
.tab[aria-selected="true"]{color:var(--blue)}
.tab svg{width:25px;height:25px}
.tab:active{opacity:.6}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="scroller">

<!-- ============ 今日 ============ -->
<section class="screen on" id="s-today" aria-label="今天">
  <nav class="nav"><span class="slot-l"></span><h2 class="nav-mini">今天</h2><span class="slot-r"></span></nav>
  <div class="head">
    <div class="row1"><h1 class="title">今天</h1><span class="date-note" id="today-date"></span></div>
  </div>

  <div class="card" style="margin-top:var(--s3)">
    <div class="t-foot" id="today-cap">已记录</div>
    <div class="metric" id="today-total">—</div>
    <div class="meter" id="today-bar" style="margin-top:var(--s4)"></div>
    <div class="legend" id="today-legend"></div>
  </div>

  <div class="sec">餐次</div>
  <div class="grp" id="today-meals"></div>

  <button class="shot" data-go="new">
    <span class="glyph"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1)"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2a2 2 0 0 0 1.7-1l.4-.7A1.6 1.6 0 0 1 10.2 3h3.6a1.6 1.6 0 0 1 1.4.8l.4.7a2 2 0 0 0 1.7 1h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12" r="3.4"/></g></svg></span>
    <span class="r-main"><h3>拍一餐</h3><p>拍食材照片，自动识别菜品</p></span>
    <svg class="chev" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</section>

<!-- ============ 新建一餐 ============ -->
<section class="screen" id="s-new" aria-label="新建一餐">
  <nav class="nav">
    <button class="glass slot-l" data-go="today" aria-label="返回"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11.5 2.5L5 9l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 class="nav-mini">记录一餐</h2><span class="slot-r"></span>
  </nav>
  <div class="head"><div class="row1"><h1 class="title">记录一餐</h1></div></div>

  <button class="shot" style="margin-top:var(--s3)" id="shot-btn">
    <span class="glyph" style="width:64px;height:64px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 1)"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2a2 2 0 0 0 1.7-1l.4-.7A1.6 1.6 0 0 1 10.2 3h3.6a1.6 1.6 0 0 1 1.4.8l.4.7a2 2 0 0 0 1.7 1h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12" r="3.4"/></g></svg></span>
    <span class="r-main"><h3>拍照识别</h3><p>对着餐盘拍一张，自动添加菜品</p></span>
    <svg class="chev" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="sec">已添加 <span class="date-note" id="draft-count" style="font-weight:400"></span></div>
  <div class="grp" id="draft-list"></div>

  <div class="sum">
    <div class="r-main"><div class="t-foot">合计热量</div><div class="metric-sm" id="draft-total">—</div><div class="note" id="draft-note" style="padding:0"></div></div>
    <button class="btn" style="width:auto;min-width:88px;height:44px;min-height:44px" data-go="result" id="save-btn">保存</button>
  </div>
</section>

<!-- ============ 单餐结果 ============ -->
<section class="screen" id="s-result" aria-label="单餐结果">
  <nav class="nav">
    <button class="glass slot-l" data-go="new" aria-label="返回"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11.5 2.5L5 9l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>午餐</h2>
    <button class="glass pill slot-r" id="edit-btn">编辑</button>
  </nav>
  <div class="head">
    <div class="row1"><h1 class="title" id="res-total">—</h1><span class="date-note" id="res-time"></span></div>
  </div>

  <div class="card" style="margin-top:var(--s3)">
    <div class="t-foot">营养构成（按供能折算）</div>
    <div class="comp" id="res-comp"></div>
  </div>

  <div class="card advice" id="res-advice" style="margin-top:var(--s3)"></div>

  <div class="sec">菜品明细 <span class="date-note" style="font-weight:400" id="res-count"></span></div>
  <div class="grp" id="res-dishes"></div>
</section>

<!-- ============ 周视图 ============ -->
<section class="screen" id="s-week" aria-label="周视图">
  <nav class="nav"><span class="slot-l"></span><h2 class="nav-mini">本周</h2><span class="slot-r"></span></nav>
  <div class="head">
    <div class="row1"><h1 class="title">最近七天</h1><span class="date-note" id="week-range"></span></div>
  </div>

  <div class="card" style="margin-top:var(--s3);padding-bottom:var(--s3)">
    <div class="t-foot" id="week-cap"></div>
    <div class="metric" id="week-total">—</div>
    <svg class="chart" id="week-chart" viewBox="0 0 358 222" role="img" aria-label="最近七天热量柱状图，按蛋白质、脂肪、碳水堆叠"></svg>
    <div class="legend" id="week-legend"></div>
    <div class="chart-note" id="week-note"></div>
  </div>

  <div class="sec">全天分布</div>
  <div class="card">
    <div class="t-foot">今天三餐 · 按用餐时间</div>
    <svg class="chart" id="day-chart" viewBox="0 0 358 168" role="img" aria-label="今天三餐热量按时间分布"></svg>
    <div class="chart-note" id="day-note"></div>
  </div>

  <div class="sec">每日</div>
  <div class="grp" id="week-days"></div>
</section>

</div>

<nav class="tabbar" role="tablist" aria-label="主导航">
  <button class="tab" role="tab" data-go="today" aria-selected="true" aria-label="今天">
    <svg viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12.5 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h4v-5.5h4V21h4a1 1 0 0 0 1-1V9.5"/></svg>
    <span>今天</span>

  "steamed-bun":{name:"馒头",cat:"主食",k:223,p:7,f:1.1,c:47,range:[205,240],def:100,src:"中国食物成分表 第6版",note:"标准白面馒头"},
  "braised-chicken-leg":{name:"红烧鸡腿",cat:"荤菜",k:200,p:18,f:12,c:4,range:[165,240],def:150,src:"中国食物成分表 第6版",note:"带骨红烧鸡腿，按可食部折算"},
  "sweet-sour-pork":{name:"糖醋里脊",cat:"荤菜",k:285,p:14,f:15,c:25,range:[235,330],def:160,src:"中国食物成分表 第6版",note:"里脊挂糊油炸后裹糖醋汁"},

};

/* 最近七天：每餐给出 [菜品 id, 克数]，热量在运行时由菜品库算出 */
const WEEK=[
  {w:"日",date:"11月16日",b:[["soy-milk",200],["steamed-egg",120],["hua-juan",60]],l:[["rice",200],["braised-pork",60],["stir-fried-greens",170]],d:[["rice",200],["kungpao-chicken",160],["garlic-broccoli",170]]},
  {w:"一",date:"11月17日",b:[["soy-milk",300],["steamed-bun",100]],l:[["egg-fried-rice",300],["seaweed-egg-soup",250]],d:[["rice",200],["mapo-tofu",180],["potato-shreds",160]]},
  {w:"二",date:"11月18日",b:[["soy-milk",200],["steamed-egg",200]],l:[["rice",200],["yu-xiang-pork",160],["shredded-cabbage",170]],d:[["egg-fried-rice",300],["tomato-egg-soup",250]]},
  {w:"三",date:"11月19日",b:[["soy-milk",200],["steamed-bun",100]],l:[["rice",200],["tomato-egg",180]],d:null},
  {w:"四",date:"11月20日",b:[["hua-juan",100],["soy-milk",200]],l:[["rice",200],["braised-chicken-leg",150],["stir-fried-greens",170]],d:[["rice",200],["sweet-sour-pork",160],["garlic-broccoli",170]]},
  {w:"五",date:"11月21日",b:null,l:null,d:null},
  {w:"六",date:"11月22日",today:true,b:[["soy-milk",300],["hua-juan",100]],l:[["rice",200],["braised-spareribs",140],["mapo-tofu",180]],d:null}
];
const PENDING={name:"酸辣汤"}; /* 菜品库无此条目，演示「待估算」状态，绝不按 0 计 */
const LUNCH=[["rice",200],["braised-spareribs",140],["mapo-tofu",180]]; /* 今天午餐，与 WEEK.六.l 一致 */

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const r0=n=>Math.round(n);
const fmt=n=>Math.round(n).toLocaleString("zh-CN");

/* 一餐/一天的营养合计：返回热量与三大营养素，另给出按供能折算的分段（用于堆叠柱） */
function agg(items){
  const s={k:0,p:0,f:0,c:0};
  for(const [id,g] of items){
    const d=DISH[id]; if(!d||!g) continue;
    const r=g/100;
    s.k+=d.k*r; s.p+=d.p*r; s.f+=d.f*r; s.c+=d.c*r;
  }
  return s;
}
function seg(a){
  const e={p:a.p*4,f:a.f*9,c:a.c*4}, sum=e.p+e.f+e.c;
  const n=v=>sum>0? a.k*v/sum : 0;
  return {k:a.k,p:n(e.p),f:n(e.f),c:n(e.c)};
}
function dayOf(d){
  const meals={b:d.b&&agg(d.b),l:d.l&&agg(d.l),d:d.d&&agg(d.d)};
  const segs={};
  for(const key in meals) segs[key]=meals[key]?seg(meals[key]):null;
  const total=[segs.b,segs.l,segs.d].filter(Boolean).reduce((o,m)=>({k:o.k+m.k,p:o.p+m.p,f:o.f+m.f,c:o.c+m.c}),{k:0,p:0,f:0,c:0});
  const rec=["b","l","d"].filter(key=>segs[key]).length;
  const status=rec===0?"none":(rec===3?"full":"partial");
  return {segs,total,rec,status};
}

/* ---------- 通用小构件 ---------- */
const CHEV='<svg class="chev" viewBox="0 0 8 13" fill="none"><path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const MEALS=[["b","早餐","07:40"],["l","午餐","11:52"],["d","晚餐","18:30"]];

/* 柱形裁剪：只有顶角是圆的（半径 4），底边与中缝保持齐平，段与段之间重叠 0.6px 消除亚像素接缝 */
function barClip(id,bx,w,top,h){
  const r=Math.min(4,w/2,h);
  const bt=top+r, bb=top+h;
  return `<clipPath id="${id}"><path d="M${bx} ${bb} V${bt} A${r} ${r} 0 0 1 ${bx+r} ${top} H${bx+w-r} A${r} ${r} 0 0 1 ${bx+w} ${bt} V${bb} Z"/></clipPath>`;
}
function stacked(seg){
  const total=seg.k||1;
  return ["p","f","c"].map(k=>{
    const pct=seg[k]/total*100;
    return pct<=0?"":`<i class="m-${k}" style="width:${pct.toFixed(2)}%"></i>`;
  }).join("");
}

/* ---------- 今日 ---------- */
function renderToday(){
  $("#today-date").textContent="11月22日 周六";
  const d=WEEK[6], day=dayOf(d);
  $("#today-cap").textContent=`已记录 ${day.rec} 餐`;
  $("#today-total").innerHTML=`${fmt(day.total.k)}<em>千卡</em>`;
  $("#today-bar").innerHTML=stacked(day.total);
  $("#today-legend").innerHTML=[["p","蛋白",day.total.p],["f","脂肪",day.total.f],["c","碳水",day.total.c]]
    .map(([k,n,v])=>`<div><div class="k ${k}">${n}</div><div class="v">${r0(v)} 克</div></div>`).join("");

  let rows="";
  for(const [key,nm,time] of MEALS){
    const sg=day.segs[key];
    if(sg){
      const items=d[key].map(([id])=>DISH[id].name).join(" · ");
      rows+=`<button class="row" data-go="result"><div class="r-main"><div class="r-name">${nm}</div><div class="r-sub">${time} · ${items}</div></div><span class="r-val"><b>${fmt(sg.k)}</b><span class="unit">千卡</span></span>${CHEV}</button>`;
    }else{
      rows+=`<button class="row" data-go="new"><div class="r-main"><div class="r-name" style="color:var(--lbl2)">${nm}</div><div class="r-sub">未记录</div></div><span class="r-val" style="color:var(--blue);font-weight:400">添加</span></button>`;
    }
  }
  $("#today-meals").innerHTML=rows;
}

/* ---------- 新建一餐 ---------- */
function renderDraft(){
  let rows="";
  for(const [id,g] of LUNCH){
    const d=DISH[id], kcal=d.k*g/100, lo=d.range[0]*g/100, hi=d.range[1]*g/100;
    rows+=`<button class="row"><div class="r-main"><div class="r-name">${d.name}</div><div class="r-sub">${g} 克 · 约 ${fmt(lo)}–${fmt(hi)} 千卡</div></div><span class="r-val"><b>${fmt(kcal)}</b><span class="unit">千卡</span></span>${CHEV}</button>`;
  }
  rows+=`<button class="row"><div class="r-main"><div class="r-name" style="color:var(--lbl2)">${PENDING.name}</div><div class="r-sub">待估算 · 等待确认份量</div></div><span class="r-val"><span class="pill-tag">待估算</span></span></button>`;
  $("#draft-list").innerHTML=rows;
  $("#draft-count").textContent=`${LUNCH.length} 道 + 1 待估算`;
  const a=agg(LUNCH);
  $("#draft-total").innerHTML=`${fmt(a.k)}<em>千卡</em>`;
  $("#draft-note").textContent=`不含${PENDING.name}，估算后合计会更高`;
}

/* ---------- 单餐结果 ---------- */
function renderResult(){
  const a=agg(LUNCH), s=seg(a);
  $("#res-total").textContent=`${fmt(a.k)} 千卡`;
  $("#res-time").textContent="午餐 · 11:52";
  $("#res-count").textContent=`${LUNCH.length} 道菜`;
  const legend=[["p","蛋白",s.p],["f","脂肪",s.f],["c","碳水",s.c]]
    .map(([k,n,v])=>`<div><div class="k ${k}">${n}</div><div class="v">${fmt(v)} 千卡</div></div>`).join("");
  $("#res-comp").innerHTML=`<div class="meter">${stacked(s)}</div><div class="legend">${legend}</div>`;

  let html="";
  LUNCH.forEach(([id,g],i)=>{
    const d=DISH[id], kcal=d.k*g/100, lo=r0(d.range[0]*g/100), hi=r0(d.range[1]*g/100);
    const pm=v=>r0(d[v]*g/100);
    html+=`<div class="dish${i===0?" open":""}" data-dish>
      <button class="dish-hd" aria-expanded="${i===0}"><div class="r-main"><div class="r-name">${d.name}</div><div class="r-sub">${g} 克 · 蛋白 ${pm("p")} 克</div></div><span class="r-val"><b>${fmt(kcal)}</b><span class="unit">千卡</span></span>${CHEV}</button>
      <div class="dish-body"><dl class="spec">
        <dt>份量</dt><dd>${g} 克</dd>
        <dt>每 100 克</dt><dd>${d.k} 千卡</dd>
        <dt>本份折算</dt><dd>${fmt(kcal)} 千卡</dd>
        <dt>估算区间</dt><dd class="range">${fmt(lo)}–${fmt(hi)} 千卡</dd>
        <dt>营养</dt><dd>蛋白 ${pm("p")} · 脂肪 ${pm("f")} · 碳水 ${pm("c")} 克</dd>
        <dt>出处</dt><dd>${d.src}<span class="src-note">${d.note}</span></dd>
      </dl></div></div>`;
  });
  $("#res-dishes").innerHTML=html;
  $("#res-advice").innerHTML=adviceHTML();
}

/* ---------- 膳食小贴士：只看本餐实际菜品与营养，挑最值得说的一条 ---------- */
function adviceHTML(){
  const known=LUNCH.filter(([id])=>DISH[id]);
  const cats=known.map(([id])=>DISH[id].cat);
  const a=agg(known), e={p:a.p*4,f:a.f*9,c:a.c*4}, sum=a.k||1;
  const carb=e.c/sum*100, prot=e.p/sum*100, fat=e.f/sum*100;
  const names=known.slice(0,3).map(([id])=>DISH[id].name).join("、");
  const greensK=Math.round(DISH["stir-fried-greens"].k*170/100);
  const riceK=Math.round(DISH.rice.k);
  const hasVeg=cats.includes("蔬菜"), hasStaple=cats.includes("主食");
  const rule=(h,p,ok)=>{
    const c=ok?"52,199,89":"255,149,0";
    return `<span class="ico" style="color:rgb(${c});background:rgba(${c},.13)">`+
    (ok
      ? '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-8"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17c4-1.5 6-4.5 6-8 0-2-1-4.5-2.5-6C11 5 9.5 8 10 11"/><path d="M10 16.5c-4-1.5-6-4.3-6-7.5 0-2 1-4.5 2.5-6C9 5 10.5 8 10 11"/></svg>')
    +`</span><div class="r-main"><h3>${h}</h3><p>${p}</p></div>`;
  };

  if(!hasVeg) return rule("这餐还差一点绿。",`${names}里没有蔬菜，添一份清炒青菜（约 170 克）只需 ${greensK} 千卡，膳食纤维和维生素就能补上一截。`);
  if(!hasStaple) return rule("主食偏少。",`这餐以菜为主，碳水只供能 ${r0(carb)}%，下午容易饿，加一小份米饭（约 100 克）约 ${riceK} 千卡。`);
  if(carb>65) return rule("主食占比偏高。",`碳水供能占 ${r0(carb)}%，超过 65%。下次主食可留三分之一，用一份青菜补上饱腹感。`);
  if(prot<15) return rule("蛋白质偏低。",`蛋白供能只占 ${r0(prot)}%。加一个蒸蛋或一杯豆浆，几乎不添脂肪就能把蛋白补到两成。`);
  if(fat>50) return rule("油脂偏多。",`脂肪供能占 ${r0(fat)}%。红烧类的汤汁尽量别拌饭，能少摄入一部分油脂。`);
  return rule("这餐搭配均衡。",`${names}覆盖了主食、蛋白与蔬菜，三大营养素供能比约 ${r0(prot)} : ${r0(fat)} : ${r0(carb)}，不必额外补充。`,true);
}

/* ---------- 周视图 ---------- */
function renderWeek(){
  const days=WEEK.map(d=>({d,day:dayOf(d)}));
  $("#week-range").textContent="11月16日 – 22日";
  const recorded=days.filter(x=>x.day.status!=="none");
  const totalK=recorded.reduce((s,x)=>s+x.day.total.k,0);
  $("#week-cap").textContent=recorded.length<7?`最近七天 · 已记录 ${recorded.length} 天`:"最近七天";
  $("#week-total").innerHTML=`${fmt(totalK)}<em>千卡</em>`;

  const complete=days.filter(x=>x.day.status==="full");
  const avg=complete.reduce((s,x)=>s+x.day.total.k,0)/Math.max(complete.length,1);

  const W=358,H=222,padL=6,padR=52,padT=16,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB, y0=padT+plotH;
  const yMax=1800, ticks=[0,600,1200,1800];
  const yv=v=>y0-v/yMax*plotH;
  const slot=plotW/7, barW=24;

  let grid="", bars="", labels="", marks="";
  for(let i=0;i<=7;i++){
    const x=padL+slot*i;
    grid+=`<line class="vgrid" x1="${x}" y1="${padT}" x2="${x}" y2="${y0}"/>`;
  }
  for(const t of ticks){
    if(t>0) grid+=`<line class="grid" x1="${padL}" y1="${yv(t)}" x2="${padL+plotW}" y2="${yv(t)}"/>`;
    labels+=`<text class="ylab" x="${padL+plotW+8}" y="${yv(t)+4}">${t===0?"0":fmt(t)}</text>`;
  }
  grid+=`<line class="axis" x1="${padL}" y1="${y0}" x2="${padL+plotW}" y2="${y0}"/>`;

  days.forEach((x,i)=>{
    const cx=padL+slot*(i+0.5), bx=cx-barW/2, st=x.day.status;
    const lab=`<text class="xlab${st==="none"?" off":""}" x="${cx}" y="${y0+17}" text-anchor="middle">${x.d.w}</text>`;
    labels+=lab;
    if(st==="none"){
      bars+=`<rect class="ghost" x="${bx}" y="${y0-11}" width="${barW}" height="11" rx="4"/>`;
      marks+=`<circle cx="${cx}" cy="${y0+25}" r="2" fill="none" stroke="#C7C7CC" stroke-width="1.2"/>`;
      return;
    }
    const t=x.day.total, h=t.k/yMax*plotH;
    const clipId=`bar${i}`;
    bars+=barClip(clipId,bx,barW,yv(t.k),h);
    let acc=0;
    for(const k of ["p","f","c"]){
      const v=t[k]; if(v<=0) continue;
      const exact=v/yMax*plotH;
      bars+=`<rect class="b-${k} bar" x="${bx}" y="${(y0-acc-exact).toFixed(2)}" width="${barW}" height="${(exact+0.6).toFixed(2)}" clip-path="url(#${clipId})" style="animation-delay:${i*55}ms"/>`;
      acc+=exact;
    }
    if(st==="partial") marks+=`<circle cx="${cx}" cy="${y0+25}" r="2" fill="none" stroke="#FF9500" stroke-width="1.2"/>`;
  });

  /* 周平均虚线 + 右侧「平均」标注，照参考图 */
  const ay=yv(avg);
  const avgMark=`<line class="avg" x1="${padL}" y1="${ay}" x2="${padL+plotW}" y2="${ay}"/>`+
    `<text class="ylab" x="${padL+plotW+8}" y="${ay+4}" style="fill:#8E8E93">平均</text>`;

  $("#week-chart").innerHTML=grid+bars+avgMark+labels+marks;

  /* 图例：一周按营养分色的供能合计 */
  const tot={p:0,f:0,c:0};
  recorded.forEach(x=>{for(const k in tot) tot[k]+=x.day.total[k];});
  $("#week-legend").innerHTML=[["p","蛋白",tot.p],["f","脂肪",tot.f],["c","碳水",tot.c]]
    .map(([k,n,v])=>`<div><div class="k ${k}">${n}</div><div class="v">${fmt(v)} 千卡</div></div>`).join("");
  $("#week-note").innerHTML=`柱高为每日热量，按蛋白/脂肪/碳水供能分色堆叠。虚线为 ${complete.length} 个记满三餐日的平均 ${fmt(avg)} 千卡，未记满与未记录的日子不计入。<br><span class="dot dot-off"></span>空心橙点＝已记未满　<span class="dot"></span>灰柱＝未记录`;

  renderDayChart();

  /* 每日列表 */
  let rows="";
  for(const {d,day} of days){
    const tag=day.status==="full"?"":(day.status==="partial"?'<span class="pill-tag" style="margin-left:8px">未记满三餐</span>':"");
    const val=day.status==="none"?'<span class="r-val" style="color:var(--lbl3)">未记录</span>'
      :`<span class="r-val"><b>${fmt(day.total.k)}</b><span class="unit">千卡</span></span>`;
    const sub=day.status==="full"?`${d.date} · 三餐齐全`
      :day.status==="partial"?`${d.date} · 已记 ${day.rec} 餐`
      :`${d.date} · 暂无数据`;
    rows+=`<div class="row"><div class="r-main"><div class="r-name">${d.w}${d.today?'　今天':''}</div><div class="r-sub">${sub}${tag}</div></div>${val}</div>`;
  }
  $("#week-days").innerHTML=rows;
}

/* 今天三餐按用餐时间的分布，照参考图的第二张图 */
function renderDayChart(){
  const W=358,H=168,padL=6,padR=52,padT=14,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB, y0=padT+plotH;
  const yMax=900, ticks=[0,300,600,900], yv=v=>y0-v/yMax*plotH;
  const t0=5, t1=22, tx=h=>padL+plotW*(h-t0)/(t1-t0);
  let grid="", bars="", labels="";
  for(const t of ticks){
    if(t>0) grid+=`<line class="grid" x1="${padL}" y1="${yv(t)}" x2="${padL+plotW}" y2="${yv(t)}"/>`;
    labels+=`<text class="ylab" x="${padL+plotW+8}" y="${yv(t)+4}">${t===0?"0":fmt(t)}</text>`;
  }
  grid+=`<line class="axis" x1="${padL}" y1="${y0}" x2="${padL+plotW}" y2="${y0}"/>`;
  for(const h of [6,12,18]){
    const x=tx(h);
    grid+=`<line class="vgrid" x1="${x}" y1="${padT}" x2="${x}" y2="${y0}"/>`;
    labels+=`<text class="xlab" x="${x}" y="${y0+16}" text-anchor="middle">${h}时</text>`;
  }
  const d=WEEK[6], barW=22;
  const pts=[["b","07:40",7.67],["l","11:52",11.87],["d","18:30",18.5]];
  pts.forEach(([key,time,hr],i)=>{
    const cx=tx(hr), bx=cx-barW/2;
    if(!d[key]){
      bars+=`<rect class="ghost" x="${bx}" y="${y0-11}" width="${barW}" height="11" rx="4"/>`;
      return;
    }
    const sg=dayOf(d).segs[key], h=sg.k/yMax*plotH, cid=`d${i}`;
    bars+=barClip(cid,bx,barW,yv(sg.k),h);
    let acc=0;
    for(const k of ["p","f","c"]){
      const v=sg[k]; if(v<=0) continue;
      const exact=v/yMax*plotH;
      bars+=`<rect class="b-${k} bar" x="${bx}" y="${(y0-acc-exact).toFixed(2)}" width="${barW}" height="${(exact+0.6).toFixed(2)}" clip-path="url(#${cid})" style="animation-delay:${(i+1)*55}ms"/>`;
      acc+=exact;
    }
  });
  $("#day-chart").innerHTML=grid+bars+labels;
  $("#day-note").textContent=`早餐 361 千卡，午餐 858 千卡；晚餐未记录，以浅灰占位，不按 0 计入。`;
}

/* ---------- 交互 ---------- */
function go(name){
  $$(".screen").forEach(s=>s.classList.toggle("on",s.id==="s-"+name));
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.go===name)));
  $("#scroller").scrollTo({top:0,behavior:"instant"});
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go]");
  if(t){go(t.dataset.go);return;}
  const hd=e.target.closest(".dish-hd");
  if(hd){
    const wrap=hd.closest(".dish");
    const open=wrap.classList.toggle("open");
    hd.setAttribute("aria-expanded",String(open));
  }
});

renderToday(); renderDraft(); renderResult(); renderWeek();
/* 大标题折叠：内容区滚动离开顶部后淡入导航小标题 */
const scroller=$("#scroller");
const onScroll=()=>document.body.classList.toggle("scrolled",scroller.scrollTop>28);
scroller.addEventListener("scroll",onScroll,{passive:true}); onScroll();
</script>
