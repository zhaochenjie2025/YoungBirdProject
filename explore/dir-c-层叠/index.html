<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>卡路里拍立得 · 层叠方向</title>
<style>
/* ============ 设计令牌：一套材质，阴影只有一个推导公式 ============ */
:root{
  --ink:#1c1916;
  --ink-2:#4a4139;
  --ink-3:#7a6e63;
  --paper:#f3ecdd;
  --paper-hi:#fbf6ec;
  --paper-lo:#e3d6c0;
  --paper-edge:#cbbba0;
  --table:#211d19;
  --table-2:#2b2621;
  --table-3:#171310;
  --accent:#c4512f;
  --seal:#a8322a;
  --brass:#c9a25f;
  --cream:#f6efe1;
  --cream-72:rgba(246,239,225,.72);

  /* 类别色：卡片左侧露出的色条，叠起来成一列菜品配比 */
  --c-staple:#c9974a;
  --c-meat:#b0462f;
  --c-veg:#4e7c5b;
  --c-egg:#c9a24a;
  --c-soup:#3e7c8a;
  --c-other:#8a7a66;

  /* 阴影单一公式：所有卡片都从这里取，不许各写各的 */
  --sh-a:0 calc(1px + var(--dz,0) * 1px) 0 rgba(120,96,64,.30);
  --sh-b:0 calc(6px + var(--dz,0) * 3px) calc(16px + var(--dz,0) * 9px) rgba(10,8,6,.42);
  --sh-c:0 calc(14px + var(--dz,0) * 6px) calc(34px + var(--dz,0) * 14px) rgba(6,4,2,.36);

  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);
  color:var(--cream);
  background:
    radial-gradient(120% 72% at 50% -8%, #33291f 0%, var(--table-2) 34%, var(--table) 66%, var(--table-3) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* 木纹桌面：极淡的重复织理，只做底层，不参与动画 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(91deg, rgba(0,0,0,0) 0 11px, rgba(0,0,0,.10) 11px 12px),
    repeating-linear-gradient(91deg, rgba(255,224,180,0) 0 43px, rgba(255,224,180,.015) 43px 44px);
}
/* 桌面接触光：叠得越重、越靠下越暗，由 JS 写 --press */
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(96% 54% at 50% 100%, rgba(0,0,0,var(--press,.34)) 0%, rgba(0,0,0,0) 62%);
}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.is-on{display:block}
.wrap{width:100%;max-width:440px;margin:0 auto;padding:0 18px}
</style>
<style>
/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 10px}
.topbar .brand{display:flex;flex-direction:column;gap:2px}
.topbar .brand b{font-size:15px;letter-spacing:.06em;color:var(--cream);font-weight:600}
.topbar .brand span{font-size:11.5px;letter-spacing:.05em;color:var(--cream-72)}
.topbar .today{text-align:right;font-size:12px;letter-spacing:.04em;color:var(--cream-72)}
.topbar .today strong{display:block;font-family:var(--mono);font-size:19px;letter-spacing:.02em;color:var(--brass);font-weight:500}
.rule{height:1px;background:linear-gradient(90deg,rgba(201,162,95,0),rgba(201,162,95,.45),rgba(201,162,95,0))}

/* ============ 数字：纸面打印机感 ============ */
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ============ 卡片堆栈舞台 ============ */
.stage{position:relative;perspective:1100px;perspective-origin:50% 6%;margin:0 -2px;padding-top:calc(var(--peek,26px) * 3 + 14px)}
.deck{position:relative;height:var(--card-h,236px)}
.deck-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dish-card{
  position:absolute;left:0;right:0;top:0;height:var(--card-h,236px);
  border-radius:11px;
  transform-origin:50% 0%;
  transform:
    translateX(var(--dx,0px))
    translateY(calc(var(--i) * var(--peek,26px) * -1))
    translateZ(calc(var(--i) * -30px))
    rotateX(calc(var(--i) * 1.15deg))
    rotateY(var(--dry,0deg))
    scale(calc(1 - var(--i) * .022));
  z-index:calc(60 - var(--i));
  --dz:calc(var(--i) * 1.3 + .45);
  box-shadow:var(--sh-a),var(--sh-b),var(--sh-c);
  transition:transform .5s cubic-bezier(.2,1.12,.3,1), opacity .3s ease, box-shadow .5s ease;
  will-change:transform;
  cursor:grab;
  touch-action:pan-y;
  background:
    radial-gradient(circle at calc(100% - 20px) 18px, var(--table) 0 5.5px, rgba(0,0,0,.45) 5.8px 6.8px, rgba(255,255,255,.35) 7px 7.8px, transparent 8px),
    repeating-linear-gradient(93deg, rgba(150,120,80,.045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(3deg, rgba(110,84,48,.04) 0 1px, transparent 1px 4px),
    radial-gradient(130% 120% at 18% -10%, var(--paper-hi) 0%, var(--paper) 52%, var(--paper-lo) 100%);
  border:1px solid rgba(255,255,255,.55);
  overflow:hidden;
  user-select:none;
}
/* 纸纤维颗粒 + 顶部叠压阴影（前一张卡投在它上面的暗带） */
.dish-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(rgba(90,68,40,.10) .6px, transparent .8px) 0 0/6px 6px,
    linear-gradient(180deg, rgba(30,22,14,.30) 0, rgba(30,22,14,.10) 10px, transparent 26px);
  opacity:calc(.5 + var(--i) * .12);
}
/* 类别色边：左侧一窄条，叠起来成为一列菜品配比 */
.dish-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:7px;z-index:2;
  background:linear-gradient(90deg,var(--cat),color-mix(in srgb,var(--cat) 70%,#000) 100%);
  box-shadow:inset -1px 0 0 rgba(0,0,0,.25);
}
.dish-card.is-front{border-color:rgba(255,255,255,.75);cursor:grab}
.dish-card.is-ghost{opacity:0!important;pointer-events:none}

.card-in{position:absolute;inset:0;padding:16px 16px 14px 20px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-right:26px}
.card-name{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:21px;line-height:1.15;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.card-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;margin-top:3px}
.card-kcal{text-align:right;flex:none}
.card-kcal b{font-family:var(--mono);font-size:25px;font-weight:600;color:var(--ink);line-height:1}
.card-kcal span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.14em;margin-top:2px}
.card-kcal.pending b{font-family:var(--font);font-size:15px;color:var(--seal);letter-spacing:.04em}

.card-mid{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:9px;border-top:1px dashed rgba(120,96,64,.4)}
.card-foot .src{font-size:11px;color:var(--ink-3);line-height:1.4;max-width:58%}
.card-foot .per{font-size:11px;color:var(--ink-2);text-align:right;line-height:1.5}
.card-foot .per b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* 胶带：钉住卡片的手工感 */
.tape{
  position:absolute;top:-9px;left:34px;width:64px;height:19px;transform:rotate(-4deg);
  background:linear-gradient(180deg,rgba(232,203,152,.88),rgba(214,180,124,.82));
  box-shadow:0 1px 2px rgba(0,0,0,.18);
  z-index:3;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 3.6px);
  mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 3.6px);
}
/* 右缘“可推开”撕口暗示 */
.peel{position:absolute;right:0;top:0;bottom:0;width:14px;z-index:2;background:linear-gradient(90deg,transparent,rgba(120,96,64,.10));border-radius:0 10px 10px 0}
.peel::after{content:"";position:absolute;right:5px;top:50%;width:5px;height:5px;border-right:1.5px solid rgba(122,110,99,.6);border-top:1.5px solid rgba(122,110,99,.6);transform:translateY(-50%) rotate(45deg)}

/* 深层卡只留头部，被前卡遮住大半 */
.dish-card.is-deep .card-in{padding:12px 16px 12px 20px}
.dish-card.is-deep .card-mid,.dish-card.is-deep .card-foot,.dish-card.is-deep .peel{display:none}
.dish-card.is-deep .card-name{font-size:15px}
.dish-card.is-deep .card-kcal b{font-size:16px}
.dish-card.is-deep .card-kcal span{display:none}
.dish-card.is-deep .tape{display:none}
.deck-more{position:absolute;right:6px;top:-22px;font-size:11px;color:var(--cream-72);letter-spacing:.05em;z-index:70}

/* 份量芯片：硬纸卡上的刻位 */
.chip{
  border:1px solid rgba(90,70,44,.35);background:rgba(255,255,255,.34);
  color:var(--ink-2);border-radius:5px;padding:5px 9px;font-size:11.5px;line-height:1;
  font-family:var(--font);letter-spacing:.02em;cursor:pointer;transition:transform .16s,background .2s,color .2s;
}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:active{transform:scale(.94)}
.grams-edit{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3)}
.grams-edit b{font-family:var(--mono);color:var(--ink);font-size:12.5px}
.card-grip{width:24px;height:24px;border-radius:50%;border:1px solid rgba(90,70,44,.35);display:grid;place-items:center;color:var(--ink-2);font-size:15px;line-height:1;background:rgba(255,255,255,.3)}

/* ============ 小票纸带 ============ */
.tape-wrap{position:relative;margin:18px auto 0;width:calc(100% - 34px);max-width:330px;transition:transform .45s cubic-bezier(.2,1.1,.3,1),opacity .4s ease}
.tape-wrap.tearing{transform:translateY(70%) rotate(2.5deg);opacity:0}
.receipt{
  position:relative;background:linear-gradient(180deg,#fbf7ec,#f4ecda 60%,#eee3cd);
  color:var(--ink);border-radius:0 0 4px 4px;padding:16px 16px 12px;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 18px rgba(0,0,0,.32), 0 2px 4px rgba(0,0,0,.22);
  text-shadow:none;
}
/* 上缘撕齿（与小票穿孔） */
.receipt::before{
  content:"";position:absolute;left:0;right:0;top:-7px;height:7px;background:inherit;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 11px);
  mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 11px);
}
/* 穿孔撕线 */
.perf{height:1px;border-top:1.5px dashed rgba(90,70,44,.5);position:relative;margin:10px -16px}
.perf::before,.perf::after{content:"";position:absolute;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--table);box-shadow:inset -1px 1px 2px rgba(0,0,0,.5)}
.perf::before{left:-6px}.perf::after{right:-6px}
.rc-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3);letter-spacing:.08em}
.rc-total{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 2px}
.rc-total .k{font-size:12px;color:var(--ink-3);letter-spacing:.2em;align-self:center}
.rc-total .v{font-family:var(--mono);font-size:46px;line-height:.86;font-weight:600;color:var(--ink);letter-spacing:-.03em}
.rc-total .v small{font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:.06em;margin-left:4px}
.rc-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px}
.rc-macros div{padding:7px 0 5px;border-top:1px solid rgba(90,70,44,.22);border-right:1px solid rgba(90,70,44,.16)}
.rc-macros div:last-child{border-right:0}
.rc-macros b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink)}
.rc-macros span{font-size:11px;color:var(--ink-3);letter-spacing:.12em}
.rc-macros .na b{font-family:var(--font);font-size:12px;color:var(--ink-3);font-weight:400}
.rc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.rc-src{font-size:11px;color:var(--ink-3);line-height:1.5;max-width:64%}
.stamp{
  font-family:"Songti SC",serif;font-weight:700;color:var(--seal);border:2px solid var(--seal);
  border-radius:6px;padding:3px 8px;font-size:12px;letter-spacing:.16em;transform:rotate(-7deg);
  opacity:.86;mix-blend-mode:multiply;box-shadow:0 0 0 1px rgba(168,50,42,.25) inset;
}
.stamp.pending{color:var(--accent);border-color:var(--accent)}
.rc-empty{font-size:12.5px;color:var(--ink-3);text-align:center;padding:10px 0 4px;line-height:1.6}

/* ============ 底部操作坞 + 快门 ============ */
.dock{position:sticky;bottom:0;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 4px calc(10px + var(--safe-b));background:linear-gradient(180deg,rgba(23,19,16,0),rgba(23,19,16,.86) 38%,rgba(23,19,16,.96))}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(201,162,95,.4);background:rgba(201,162,95,.08);
  color:var(--cream);border-radius:999px;padding:10px 14px;font-size:12.5px;letter-spacing:.04em;cursor:pointer;transition:transform .15s,background .2s}
.btn-ghost:active{transform:scale(.96);background:rgba(201,162,95,.16)}
.shutter{
  position:relative;width:70px;height:70px;border-radius:50%;border:0;cursor:pointer;flex:none;
  background:radial-gradient(circle at 50% 32%,#f7e9c8,#d9b878 46%,#a8803f 72%,#7a5a29 100%);
  box-shadow:0 2px 0 rgba(255,246,222,.55) inset,0 -3px 0 rgba(60,40,16,.55) inset,0 6px 12px rgba(0,0,0,.45),0 1px 0 rgba(0,0,0,.5);
  display:grid;place-items:center;transition:transform .12s;
}
.shutter::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(70,48,20,.45);box-shadow:0 0 0 1px rgba(255,245,220,.25) inset}
.shutter::after{content:"";position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#3b3128,#1b1611 78%);box-shadow:0 1px 0 rgba(255,255,255,.14) inset}
.shutter svg{position:relative;z-index:2;width:24px;height:24px;stroke:#f2e3bd;stroke-width:1.8;fill:none}
.shutter:active{transform:scale(.94)}
.shutter .ring{position:absolute;inset:-5px;border-radius:50%;border:1px dashed rgba(201,162,95,.45)}
.dock .save{display:inline-flex;flex-direction:column;align-items:flex-end;gap:1px;border:0;background:none;color:var(--cream);cursor:pointer;padding:6px 2px}
.dock .save b{font-size:13.5px;letter-spacing:.05em}
.dock .save span{font-size:11px;color:var(--cream-72)}
.dock .save:disabled{opacity:.35;cursor:default}

/* ============ 底部导航：文件袋纸标签 ============ */
.nav{position:relative;z-index:90;display:flex;gap:6px;padding:0 10px calc(8px + var(--safe-b));background:var(--table-3);border-top:1px solid rgba(201,162,95,.18)}
.nav button{
  flex:1;border:0;background:linear-gradient(180deg,#3a322a,#241f1a);color:rgba(246,239,225,.62);
  padding:9px 4px 10px;font-size:11.5px;letter-spacing:.06em;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px 8px 0 0;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset;transition:color .2s,background .2s,transform .2s;
}
.nav button svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;fill:none}
.nav button.on{color:var(--cream);background:linear-gradient(180deg,var(--table-2),#33291f);transform:translateY(-2px)}
.nav button.on::after{content:"";position:absolute;left:14%;right:14%;bottom:4px;height:2px;background:var(--brass);border-radius:2px;box-shadow:0 0 8px rgba(201,162,95,.7)}
</style>
<style>
/* ============ 今日：已录餐次小叠 + 空状态 ============ */
.page-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 2px}
.page-h h1{font-family:"Songti SC","STSong",serif;font-size:26px;margin:0;letter-spacing:.04em;color:var(--cream);font-weight:700}
.page-h .sub{font-size:12px;color:var(--cream-72);letter-spacing:.04em}
.meal-row{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:stretch;margin-top:12px;cursor:pointer}
.meal-row .when{display:flex;flex-direction:column;justify-content:center;padding:2px 0}
.meal-row .when b{font-family:"Songti SC",serif;font-size:16px;color:var(--cream);letter-spacing:.04em}
.meal-row .when span{font-family:var(--mono);font-size:11px;color:var(--cream-72);margin-top:2px}
.mini-stack{position:relative;display:flex;flex-direction:column;gap:0}
.mini-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,var(--paper-hi),var(--paper));
  border:1px solid rgba(255,255,255,.5);border-left:5px solid var(--cat);border-radius:7px;padding:9px 11px;color:var(--ink);
  box-shadow:var(--sh-a),0 3px 8px rgba(0,0,0,.28);transform-origin:50% 0;
  transition:transform .3s cubic-bezier(.2,1.1,.3,1)}
.mini-item+.mini-item{margin-top:-6px;transform:translateY(calc(var(--j)* -3px)) scale(calc(1 - var(--j)*.012));z-index:calc(10 - var(--j))}
.mini-item .nm{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.mini-item .nm i{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400}
.mini-item .kc{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.mini-item .kc.na{font-family:var(--font);font-size:11px;color:var(--seal)}
.meal-row .meal-total{grid-column:2;display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-left:2px}
.meal-row .meal-total .t{font-size:12px;color:var(--cream-72);letter-spacing:.04em}
.meal-row .meal-total .t b{font-family:var(--mono);font-size:16px;color:var(--brass);font-weight:600;margin-left:2px}

.empty-deck{position:relative;margin:34px auto 0;width:min(320px,86%);aspect-ratio:1/.78;perspective:900px}
.empty-deck .ghost-card{position:absolute;left:0;right:0;top:0;height:62%;border-radius:11px;
  background:linear-gradient(180deg,rgba(243,236,221,.10),rgba(243,236,221,.04));border:1.5px dashed rgba(201,162,95,.4);
  transform-origin:50% 0;transform:translateY(calc(var(--i)* -14px)) rotateX(calc(var(--i)*1.4deg)) scale(calc(1 - var(--i)*.03));
  box-shadow:0 6px 18px rgba(0,0,0,.3)}
.empty-deck .hint{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);text-align:center;width:90%}
.empty-deck .hint p{margin:0 0 4px;font-size:14px;color:var(--cream);letter-spacing:.02em;line-height:1.5}
.empty-deck .hint small{font-size:11.5px;color:var(--cream-72);letter-spacing:.03em}
.empty-deck .cam{position:absolute;left:50%;top:0;transform:translate(-50%,-34%);width:54px;height:54px;border-radius:14px;
  background:linear-gradient(180deg,#f0dfb8,#c9a25f);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.4),0 1px 0 rgba(255,246,222,.6) inset}
.empty-deck .cam svg{width:26px;height:26px;stroke:#5a3f1c;stroke-width:1.7;fill:none}

/* ============ 单餐结果：详情 + 展开 ============ */
.result-hero{position:relative;margin-top:8px;padding:18px 18px 16px;border-radius:14px;
  background:
    radial-gradient(circle at 100% 0,rgba(255,255,255,.5),transparent 40%),
    repeating-linear-gradient(93deg,rgba(150,120,80,.05) 0 2px,transparent 2px 5px),
    linear-gradient(180deg,var(--paper-hi),var(--paper) 60%,var(--paper-lo));
  color:var(--ink);box-shadow:var(--sh-a),var(--sh-b),var(--sh-c);border:1px solid rgba(255,255,255,.55)}
.result-hero .rh-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.result-hero .rh-kcal{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.result-hero .rh-kcal b{font-family:var(--mono);font-size:52px;line-height:.84;font-weight:600;letter-spacing:-.03em}
.result-hero .rh-kcal small{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.result-hero .rh-range{font-size:11.5px;color:var(--ink-2);margin-top:8px;padding:6px 9px;background:rgba(201,162,95,.15);border-radius:6px;border-left:3px solid var(--brass);line-height:1.4}
.rh-analysis{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink-2);border-top:1px dashed rgba(120,96,64,.4);padding-top:10px}
.rh-analysis b{color:var(--seal)}
.rh-advice{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink-2);background:rgba(78,124,91,.10);border-radius:8px;padding:10px 11px;border:1px solid rgba(78,124,91,.25)}
.rh-advice .lbl{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#3c6247;letter-spacing:.06em;margin-bottom:4px}
.rh-advice .lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:#4e7c5b}

.detail-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.dt-item{background:linear-gradient(180deg,rgba(243,236,221,.07),rgba(243,236,221,.03));border:1px solid rgba(201,162,95,.22);border-radius:10px;overflow:hidden;transition:background .25s}
.dt-item.open{background:linear-gradient(180deg,rgba(243,236,221,.11),rgba(243,236,221,.05));border-color:rgba(201,162,95,.4)}
.dt-head{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer}
.dt-swatch{width:9px;height:34px;border-radius:3px;background:var(--cat);flex:none;box-shadow:inset -1px 0 0 rgba(0,0,0,.25)}
.dt-head .nm{flex:1;min-width:0}
.dt-head .nm b{font-family:"Songti SC",serif;font-size:15px;color:var(--cream);font-weight:600}
.dt-head .nm span{display:block;font-size:11px;color:var(--cream-72);margin-top:1px}
.dt-head .kc{font-family:var(--mono);font-size:15px;color:var(--brass);text-align:right;white-space:nowrap}
.dt-head .kc.na{font-family:var(--font);font-size:11.5px;color:#e08a72}
.dt-head .arw{width:16px;height:16px;stroke:var(--cream-72);stroke-width:1.6;fill:none;transition:transform .3s;flex:none}
.dt-item.open .arw{transform:rotate(180deg)}
.dt-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.dt-item.open .dt-body{max-height:360px}
.dt-body-in{padding:2px 13px 13px 32px;font-size:12px;color:var(--cream-72);line-height:1.7}
.dt-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-bottom:9px}
.dt-grid dt{color:var(--cream-72)}
.dt-grid dd{margin:0;color:var(--cream);font-family:var(--mono);font-size:11.5px;text-align:right}
.dt-src{font-size:11px;color:rgba(246,239,225,.55);border-top:1px dashed rgba(201,162,95,.22);padding-top:8px;line-height:1.5}
.dt-src b{color:rgba(246,239,225,.8);font-weight:500}

/* ============ 周视图：层叠柱 + 未记录/不完整 ============ */
.week-strip{display:flex;gap:7px;justify-content:space-between;align-items:flex-end;margin-top:20px;padding-bottom:6px}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;min-width:0}
.wk-bar{position:relative;width:100%;height:132px;display:flex;flex-direction:column;justify-content:flex-end;perspective:600px}
.wk-stack{position:relative;display:flex;flex-direction:column-reverse;gap:0}
.wk-card{height:14px;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--paper-hi),var(--paper));
  border:1px solid rgba(255,255,255,.4);border-left:3px solid var(--cat);box-shadow:0 2px 4px rgba(0,0,0,.3);
  transform-origin:50% 100%;margin-top:-1px;transition:transform .25s}
.wk-stack .wk-card:first-child{border-radius:4px 4px 1px 1px}
.wk-empty-mark{position:absolute;left:0;right:0;bottom:2px;height:1px;background:repeating-linear-gradient(90deg,rgba(201,162,95,.3) 0 3px,transparent 3px 6px)}
.wk-day{font-size:11px;color:var(--cream-72);letter-spacing:.02em;white-space:nowrap}
.wk-day b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--cream);font-weight:500;margin-top:1px}
.wk-col.today .wk-day b{color:var(--brass)}
.wk-col.today .wk-day{color:var(--cream)}
.wk-kc{font-family:var(--mono);font-size:11px;color:var(--cream-72);height:14px;display:flex;align-items:center}
.wk-col.empty .wk-kc{font-family:var(--font);font-size:11px;color:rgba(246,239,225,.4);letter-spacing:.04em}
.wk-col.incomplete .wk-kc{color:#e0a072}
.wk-flag{position:absolute;top:-2px;right:0;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px rgba(196,81,47,.7)}
.week-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;font-size:11.5px;color:var(--cream-72)}
.week-legend span{display:inline-flex;align-items:center;gap:6px}
.week-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.week-legend i.dash{background:repeating-linear-gradient(90deg,rgba(201,162,95,.5) 0 3px,transparent 3px 6px)}
.week-legend i.dot{background:var(--accent);border-radius:50%}
.week-summary{display:flex;gap:10px;margin-top:20px}
.ws-cell{flex:1;background:linear-gradient(180deg,rgba(243,236,221,.08),rgba(243,236,221,.03));border:1px solid rgba(201,162,95,.2);border-radius:10px;padding:11px 12px}
.ws-cell b{display:block;font-family:var(--mono);font-size:20px;color:var(--brass);font-weight:600;letter-spacing:-.02em}
.ws-cell span{font-size:11px;color:var(--cream-72);letter-spacing:.04em}

/* 提示 toast */
.toast{position:fixed;left:50%;bottom:calc(108px + var(--safe-b));transform:translate(-50%,14px);z-index:200;
  background:rgba(28,25,22,.96);border:1px solid rgba(201,162,95,.4);color:var(--cream);font-size:12.5px;
  padding:10px 16px;border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:374px){
  .wrap{padding:0 13px}
  .card-name{font-size:19px}
  .card-kcal b{font-size:22px}
  .rc-total .v{font-size:40px}

}
@media (prefers-reduced-motion:reduce){
  .dish-card,.chip,.btn-ghost,.shutter,.mini-item,.dt-body,.nav button,.wk-card,.tape-wrap,.toast{transition-duration:.01ms!important}
  .dish-card{will-change:auto}
}

</head>

<script>
/* ============================================================
   卡路里拍立得 · 方向 C「层叠」探索试样
   母题：一餐 = 一叠可推开的菜卡；热量随卡叠合而变。
   零依赖、零网络；营养按项目 nutrition.ts 同口径在前端算。
   全部动效只改 transform/opacity。
   ============================================================ */
(function(){
'use strict';

/* ---------- 菜品库（与 docs/PRD 同类的校园食堂样例，每 100g 数据） ---------- */
var CAT = {
  '主食':{c:'var(--c-staple)'}, '荤菜':{c:'var(--c-meat)'}, '蔬菜':{c:'var(--c-veg)'},
  '蛋豆':{c:'var(--c-egg)'}, '汤':{c:'var(--c-soup)'}, '其他':{c:'var(--c-other)'}
};
// kcal,protein,fat,carbs per 100g；null=暂无数据
var DISHES = [
  {id:'rice',    name:'米饭',       cat:'主食', cook:'蒸', per:[116,2.6,0.3,25.9], portions:[['标准份',200],['半份',100],['小份',150]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11 北邮学一'},
  {id:'tomatoegg',name:'番茄炒蛋',  cat:'蛋豆', cook:'炒', per:[86,4.9,5.6,4.3],  portions:[['标准份',180],['半份',90]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'greens',  name:'清炒青菜',   cat:'蔬菜', cook:'炒', per:[48,1.8,3.2,3.0],  portions:[['标准份',150],['半份',75]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'braised', name:'红烧肉',     cat:'荤菜', cook:'炖', per:[478,9.6,45.0,6.0], portions:[['标准份',120],['半份',60]], src:'中国食物成分表 第6版·近似', psrc:'团队称重 2026-11', range:[430,540], rnote:'用油量与肥瘦比差异'},
  {id:'chicken', name:'宫保鸡丁',   cat:'荤菜', cook:'炒', per:[192,15.0,12.0,7.0], portions:[['标准份',150],['半份',75]], src:'中国食物成分表 第6版·近似', psrc:'团队称重 2026-11'},
  {id:'potato',  name:'醋溜土豆丝', cat:'蔬菜', cook:'炒', per:[122,2.0,7.5,12.0], portions:[['标准份',150],['半份',75]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'tofu',    name:'家常豆腐',   cat:'蛋豆', cook:'烧', per:[140,8.9,9.5,5.0],  portions:[['标准份',160],['半份',80]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'soup',    name:'紫菜蛋花汤', cat:'汤',   cook:'煮', per:[22,1.6,1.0,1.8],  portions:[['一碗',300],['半碗',150]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'noodle',  name:'手擀面',     cat:'主食', cook:'煮', per:[138,4.5,1.0,28.0], portions:[['标准份',250],['半份',125]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'fish',    name:'酸菜鱼',     cat:'荤菜', cook:'煮', per:[158,14.5,9.8,3.5], portions:[['标准份',180],['半份',90]], src:'中国食物成分表 第6版·近似', psrc:'团队称重 2026-11', range:[130,190], rnote:'汤底含油与鱼肉比例'},
  {id:'pumpkin', name:'南瓜粥',     cat:'主食', cook:'煮', per:[44,0.8,0.2,9.5],  portions:[['一碗',300],['半碗',150]], src:'中国食物成分表 第6版', psrc:'团队称重 2026-11'},
  {id:'mystery', name:'手抓饼加蛋', cat:'其他', cook:'煎', per:[null,null,null,null], portions:[['一份',160]], src:'暂无数据', psrc:'待补充'}
];
var BY_ID = {}; DISHES.forEach(function(d){ BY_ID[d.id]=d; });
var SLOT_LABEL = {breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'};
var WD = ['日','一','二','三','四','五','六'];

/* ---------- 营养计算：与 src/domain/nutrition.ts 同口径 ---------- */
function seq(n){ return Math.round(n*10)/10; }
function scaleN(per, grams){
  if(!(grams>0)) return [null,null,null,null];
  var f = grams/100; return per.map(function(v){ return v==null?null:v*f; });
}
function roundN(a){ return a.map(function(v,i){ return v==null?null:(i===0?Math.round(v):seq(v)); }); }
function computeItem(dish, grams, label){
  var n = roundN(scaleN(dish.per, grams));
  return { dishId:dish.id, name:dish.name, cat:dish.cat, cook:dish.cook, src:dish.src, psrc:dish.psrc,
           per100:dish.per,
           grams:grams, label:label, pending:n[0]==null, n:[n[0],n[1],n[2],n[3]],
           range: dish.range?[Math.round(dish.range[0]*grams/100),Math.round(dish.range[1]*grams/100)]:null,
           rnote:dish.rnote };
}
function summarize(items){
  var kcal=0, pend=0, p=0,f=0,c=0, pok=1,fok=1,cok=1;
  items.forEach(function(it){
    if(it.pending||it.n[0]==null){ pend++; } else { kcal+=it.n[0]; }
    if(it.n[1]==null) pok=0; else p+=it.n[1];
    if(it.n[2]==null) fok=0; else f+=it.n[2];
    if(it.n[3]==null) cok=0; else c+=it.n[3];
  });
  return { kcal:Math.round(kcal), protein: pok&&items.length?seq(p):null, fat: fok&&items.length?seq(f):null,
           carbs: cok&&items.length?seq(c):null, pendingCount:pend, itemCount:items.length };
}
function fmtG(g){ return Number.isInteger(g)?String(g):String(Math.round(g*10)/10); }
function catColor(cat){ return (CAT[cat]||CAT['其他']).c; }
/* ---------- 状态 ---------- */
var state = {
  screen:'today',
  draft:[],          // 当前新建的一餐
  saved:[],          // 今日已保存的餐
  slot:'lunch'
};
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

/* 种子：今早的早餐，让「今日」一进来有内容；也给出周视图的真实感 */
function seed(){
  var b = [ computeItem(BY_ID['pumpkin'],300,'一碗'), computeItem(BY_ID['tomatoegg'],90,'半份') ];
  state.saved = [{ id:'m1', date:'today', time:'07:50', slot:'breakfast', items:b }];
}

/* ---------- 屏幕切换 ---------- */
var SCREENS = ['today','new','result','week'];
function go(name){
  state.screen = name;
  SCREENS.forEach(function(s){ el('scr-'+s).classList.toggle('is-on', s===name); });
  Array.prototype.forEach.call(el('nav').children, function(b){ b.classList.toggle('on', b.getAttribute('data-go')===name); });
  el('scr-'+name).scrollTop = 0;
  if(name==='today') renderToday();

/* ---------- 新建页渲染 ---------- */
function renderNew(){
  var deck = el('deck'), empty = el('deck-empty');
  var n = state.draft.length;
  empty.style.display = n? 'none':'flex';
  el('deck-more').textContent = n>4 ? '共 '+n+' 道菜' : '';
  // 最多渲染 4 层（第 4 层起汇总成「还有 N 道」），超出部分不再绘制，保证性能
  var shown = Math.min(n,4);
  var html = '';
  for(var i=shown-1;i>=0;i--){ html += cardHTML(state.draft[i], i); }
  deck.innerHTML = html;
  // 为前卡注入份量刻位
  for(var k=0;k<shown;k++){ mountPortions(k); }
  renderReceipt();
  el('btn-save').disabled = n===0;
  el('save-sub').textContent = n? (n+' 道 · '+sumKlass(state.draft)) : '先加菜';
  applyPress();
}

function sumKlass(items){
  var s = summarize(items);
  var t = s.kcal + ' 千卡';
  if(s.pendingCount) t += ' · '+s.pendingCount+' 待估算';
  return t;
}

function mountPortions(i){
  var it = state.draft[i]; var host = document.querySelector('[data-portions="'+i+'"]');
  if(!host) return;
  var dish = BY_ID[it.dishId];
  var opts = dish? dish.portions : [['一份', it.grams]];
  var h = '';
  opts.forEach(function(p){
    var on = Math.abs(p[1]-it.grams) < 0.5;
    h += '<button class="chip'+(on?' on':'')+'" data-pick="'+i+'|'+p[1]+'|'+p[0]+'">'+p[0]+'<span style="opacity:.6;margin-left:5px">'+p[1]+'g</span></button>';
  });
  h += '<span class="grams-edit">实吃 <b>'+fmtG(it.grams)+'</b>g</span>';
  host.innerHTML = h;
}

function renderWeek(){
  var data = weekData();
  var strip = el('week-strip'); var html='';
  var maxKcal=0, weekTotal=0, logged=0, incomplete=0;
  data.forEach(function(day){
    var items=[]; day.meals.forEach(function(m){ m.items.forEach(function(d){ items.push(computeItem(d, d.portions[0][1], d.portions[0][0])); }); });
    var s=summarize(items);
    day._items=items; day._s=s;
    if(items.length){ logged++; maxKcal=Math.max(maxKcal,s.kcal); weekTotal+=s.kcal; if(s.pendingCount)incomplete++; }
  });
  var maxH=118;
  data.forEach(function(day){
    var s=day._s, items=day._items;
    var empty=!items.length;
    var kcH;
    if(empty){ kcH='<div class="wk-empty-mark"></div>'; }
    else {
      // 每道菜一截卡，高度按该菜热量占比
      var totalH = Math.max(10, Math.round(s.kcal/maxKcal*maxH));
      var gap=0;
      var hs = items.map(function(it,i){
        var h = Math.max(7, Math.round((it.n[0]||0)/Math.max(s.kcal,1)*totalH));

      }).join('');
      kcH = '<div class="wk-stack">'+hs+'</div>';

    html += '<div class="wk-col'+(day.today?' today':'')+(empty?' empty':'')+(s.pendingCount?' incomplete':'')+'">'
      + '<div class="wk-kc">'+(empty?'—':(s.pendingCount?'±'+s.kcal:s.kcal))+'</div>'
      + '<div class="wk-bar">'+kcH+(s.pendingCount?'<span class="wk-flag"></span>':'')+'</div>'
      + '<div class="wk-day">周'+day.wd+'<b>'+day.d.split('-')[1]+'</b></div></div>';
  });
  strip.innerHTML = html;
  el('week-total').textContent = weekTotal;
  el('week-range').textContent = logged+' 天有记录 · '+incomplete+' 天不完整';
  el('week-summary').innerHTML =
    '<div class="ws-cell"><b>'+logged+'</b><span>有记录天数</span></div>'
    + '<div class="ws-cell"><b>'+Math.round(weekTotal/7)+'</b><span>日均千卡</span></div>'
    + '<div class="ws-cell"><b>'+incomplete+'</b><span>数据不完整</span></div>';
}
/* ---------- 拖动推开卡：横向甩开顶卡即移除 ---------- */
function bindDeckDrag(){
  var deck = el('deck');
  var startX=0, dragging=false, active=null, moved=0, baseW=0;
  deck.addEventListener('pointerdown', function(e){
    var card = e.target.closest('.dish-card');
    if(!card) return;
    if(e.target.closest('.chip')) return; // 点份量不拖
    if(card.classList.contains('is-deep')) return; // 只拖顶卡
    active=card; dragging=true; startX=e.clientX; moved=0;
    baseW = deck.clientWidth || 340;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
    card.style.transition='none';
    card.style.cursor='grabbing';
  });
  deck.addEventListener('pointermove', function(e){
    if(!dragging||!active) return;
    var dx = e.clientX - startX; moved=Math.abs(dx);
    active.style.setProperty('--dx', dx+'px');
    active.style.setProperty('--dry', (dx/baseW*18)+'deg');
    active.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx)/baseW*0.9));
  });
  function end(){
    if(!dragging||!active) return;
    var dx = parseFloat(active.style.getPropertyValue('--dx'))||0;
    var idx = parseInt(active.dataset.i,10);
    active.style.transition='';
    active.style.cursor='';
    if(Math.abs(dx) > (deck.clientWidth||340)*0.34){
      // 甩出：先滑走再移除
      active.style.setProperty('--dx',(dx>0?1:-1)*480+'px');
      active.style.setProperty('--dry',(dx>0?1:-1)*30+'deg');
      active.style.opacity='0';
      var removed = active;
      setTimeout(function(){
        state.draft.splice(idx,1);
        renderNew();
      }, 230);
    } else {
      // 弹回
      active.style.setProperty('--dx','0px');
      active.style.setProperty('--dry','0deg');
      active.style.opacity='';
    }
    dragging=false; active=null;
  }
  deck.addEventListener('pointerup', end);
  deck.addEventListener('pointercancel', end);
  // 轻点顶卡：翻到最上层查看（此处即“选中最上层”即已在上层，改为提示）
  deck.addEventListener('click', function(e){
    if(moved>8) return;
    var chip = e.target.closest('.chip');
    if(chip && chip.dataset.pick){ pickPortion(chip.dataset.pick); return; }
  });
}
function pickPortion(spec){
  var parts = spec.split('|');
  var i = parseInt(parts[0],10), grams = parseFloat(parts[1]), label = parts[2];
  var it = state.draft[i]; if(!it) return;
  var dish = BY_ID[it.dishId];
  var fresh = computeItem(dish, grams, label);
  state.draft[i] = fresh;
  renderNew();
  toast(it.name+' · '+fmtG(grams)+' 克 → '+ (fresh.pending?'待估算':fresh.n[0]+' 千卡'));
}

/* ---------- 拍照模拟：加入一道菜，卡片从下方叠上来 ---------- */
var SHOOT_QUEUE = ['braised','greens','tomatoegg','chicken','tofu','potato','soup','fish','pumpkin','noodle','rice','mystery'];
var shootPtr = 0;
function shoot(){
  // 找一道还没加入的菜
  var used = {}; state.draft.forEach(function(it){ used[it.dishId]=1; });
  var pick=null;
  for(var k=0;k<SHOOT_QUEUE.length;k++){
    var id = SHOOT_QUEUE[(shootPtr+k)%SHOOT_QUEUE.length];
    if(!used[id]){ pick=BY_ID[id]; shootPtr=(shootPtr+k+1)%SHOOT_QUEUE.length; break; }
  }
  if(!pick){ pick=BY_ID['greens']; }
  var p = pick.portions[0];
  var item = computeItem(pick, p[1], p[0]);
  state.draft.push(item);
  renderNew();
  // 入场：新顶卡从更低位翻起
  var top = el('deck').querySelector('.dish-card[data-i="0"]');
  if(top){
    top.style.transition='none';
    top.style.setProperty('--i','2');
    top.style.opacity='0';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        top.style.transition='';
        top.style.setProperty('--i','0');
        top.style.opacity='';
      });
    });
  }
  toast('已叠上「'+pick.name+'」'+(item.pending?' · 待估算':(' · '+item.n[0]+' 千卡')));
  // 相机快门白闪
  flash();
}
function flash(){
  var f = document.createElement('div');
  f.style.cssText='position:fixed;inset:0;background:rgba(255,248,232,.5);z-index:300;pointer-events:none;opacity:1;transition:opacity .28s ease';
  document.body.appendChild(f);

}

    var pend = d.per[0]==null;
    h += '<button class="sp-item" data-add="'+d.id+'" style="display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1px solid rgba(201,162,95,.2);background:rgba(243,236,221,.04);border-radius:9px;padding:10px 11px;margin-bottom:7px;color:var(--cream);cursor:pointer">'
      + '<span style="width:6px;height:26px;border-radius:2px;background:'+catColor(d.cat)+';flex:none"></span>'
      + '<span style="flex:1"><b style="font-size:13.5px;font-weight:600">'+esc(d.name)+'</b>'
      + '<span style="display:block;font-size:11px;color:var(--cream-72);margin-top:1px">'+esc(d.cook)+' · '+esc(d.cat)+' · '+(pend?'暂无热量数据':d.per[0]+' 千卡/100g')+'</span></span>'
      + '<span style="font-family:var(--mono);font-size:12px;color:var(--brass)">'+d.portions[0][1]+'g</span></button>';
  });
  panel.innerHTML = h;
  wrap.appendChild(panel);
  document.body.appendChild(wrap);
  wrap.addEventListener('click', function(e){ if(e.target===wrap) wrap.remove(); });
  el('sp-close').addEventListener('click', function(){ wrap.remove(); });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-add]'), function(b){
    b.addEventListener('click', function(){
      var d = BY_ID[b.dataset.add]; var p=d.portions[0];
      state.draft.push(computeItem(d, p[1], p[0]));
      wrap.remove(); renderNew();
      var item = state.draft[state.draft.length-1];
      toast('已叠上「'+d.name+'」'+(item.pending?' · 待估算':(' · '+item.n[0]+' 千卡')));
    });
  });
}

/* ---------- 保存 ---------- */
function saveMeal(){
  if(!state.draft.length) return;
  var items = state.draft.slice();
  state.saved.push({ id:'m'+Date.now(), date:'today', time:'12:10', slot:state.slot, items:items });
  state.viewMeal = state.saved[state.saved.length-1]; state.isDraft=false;
  state.draft = [];
  renderNew();
  go('result');
  toast('已保存这一餐 · '+summarize(items).kcal+' 千卡');
}

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  var t = el('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ---------- 绑定 ---------- */
function boot(){
  seed();
  // 导航
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-go')); });
  });
  el('btn-search').addEventListener('click', openSearch);
  el('btn-shoot').addEventListener('click', shoot);
  el('btn-save').addEventListener('click', saveMeal);
  bindDeckDrag();
  renderToday(); renderNew();
  // 初始显示今日
  go('today');
}
boot();

})();
</script>

</body>
</html>
