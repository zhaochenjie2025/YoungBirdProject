<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalorieSnap 视觉方向对比</title>
<style>
:root{--bg:#f5f2ec;--ink:#1f1c18;--ink2:#6b645b;--line:#ddd5c9;--card:#fffdf9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;line-height:1.7}
header{padding:32px 20px 8px;max-width:1200px;margin:0 auto}
h1{margin:0 0 6px;font-size:24px}
.sub{color:var(--ink2);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto;padding:0 20px 48px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.item h2{margin:0;padding:14px 16px 4px;font-size:16px}
.item .meta{padding:0 16px 10px;font-size:12px;color:var(--ink2)}
.frame{aspect-ratio:390/844;background:#000;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.frame iframe{width:390px;height:844px;border:0;transform-origin:top left}
.actions{padding:12px 16px}
.actions a{display:inline-block;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none}
.notes{padding:0 16px 16px;font-size:13px;color:var(--ink2)}
.notes ul{margin:6px 0 0;padding-left:1.1em}
</style>
</head>
<body>
<header>
  <h1>CalorieSnap 视觉方向对比</h1>
  <div class="sub">四个方向均为自包含单页，零外部依赖。每个画面以 390×844 手机基准渲染，可点开独立查看。</div>
</header>
<div class="grid" id="grid"></div>
<script>
const dirs = [
  { path: 'dir-a-拍立得', name: 'A · 拍立得', desc: '即时成像相纸、白边、显影感' },
  { path: 'dir-b-仪表盘', name: 'B · 仪表盘', desc: '精密仪器面板、刻度与等宽数字' },
  { path: 'dir-c-层叠', name: 'C · 层叠', desc: '多道菜在 Z 轴叠合、推挤动画' },
  { path: 'dir-d-手账', name: 'D · 手账', desc: '食谱手账、强排版与中文编辑' },
];
const grid = document.getElementById('grid');
for (const d of dirs) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <h2>${d.name}</h2>
    <div class="meta">${d.desc}</div>
    <div class="frame"><iframe src="./${d.path}/index.html" loading="lazy" title="${d.name}"></iframe></div>
    <div class="actions"><a href="./${d.path}/index.html" target="_blank" rel="noopener">单独打开 →</a></div>
    <div class="notes" id="note-${d.path}"></div>`;
  grid.appendChild(el);
  fetch('./' + d.path + '/NOTES.md').then(r => r.ok ? r.text() : '').then(t => {
    if (t) el.querySelector('.notes').innerHTML = '<ul>' + t.split('\n').filter(l=>l.trim()).slice(0,6)
      .map(l => '<li>' + l.replace(/^[-#*\s]+/, '') + '</li>').join('') + '</ul>';
  }).catch(()=>{});
}
</script>
</body>
</html>
